name: Update GolHoyLive Football Data

on:
  workflow_dispatch:

  schedule:
    # تحديث اليوم كل 30 دقيقة
    - cron: "*/30 * * * *"

    # تحديث الأيام الأخرى مرة واحدة كل يوم
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update-football-data:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare folders
        run: |
          set -e
          mkdir -p fixtures

      # =========================================================
      # TODAY
      # Runs every 30 minutes
      # =========================================================

      - name: Get today matches
        env:
          LFA_API_KEY: ${{ secrets.LFA_API_KEY }}
        run: |
          set -e

          DATE=$(TZ=Africa/Casablanca date +%F)

          echo "Getting today matches: $DATE"

          curl --fail \
            --silent \
            --show-error \
            --get \
            "https://live-football-api.com/api/v1/matches" \
            --data-urlencode "api_key=$LFA_API_KEY" \
            --data-urlencode "date=$DATE" \
            --data-urlencode "lang=en" \
            -o data.json

          test -s data.json

          echo "Today matches downloaded."

      # =========================================================
      # YESTERDAY
      # Runs only once per day
      # =========================================================

      - name: Get yesterday matches
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
        env:
          LFA_API_KEY: ${{ secrets.LFA_API_KEY }}
        run: |
          set -e

          DATE=$(TZ=Africa/Casablanca date -d "yesterday" +%F)

          echo "Getting yesterday matches: $DATE"

          curl --fail \
            --silent \
            --show-error \
            --get \
            "https://live-football-api.com/api/v1/matches" \
            --data-urlencode "api_key=$LFA_API_KEY" \
            --data-urlencode "date=$DATE" \
            --data-urlencode "lang=en" \
            -o fixtures/yesterday.json

          test -s fixtures/yesterday.json

          echo "Yesterday matches downloaded."

      # =========================================================
      # TOMORROW
      # Runs only once per day
      # =========================================================

      - name: Get tomorrow matches
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
        env:
          LFA_API_KEY: ${{ secrets.LFA_API_KEY }}
        run: |
          set -e

          DATE=$(TZ=Africa/Casablanca date -d "tomorrow" +%F)

          echo "Getting tomorrow matches: $DATE"

          curl --fail \
            --silent \
            --show-error \
            --get \
            "https://live-football-api.com/api/v1/matches" \
            --data-urlencode "api_key=$LFA_API_KEY" \
            --data-urlencode "date=$DATE" \
            --data-urlencode "lang=en" \
            -o fixtures/tomorrow.json

          test -s fixtures/tomorrow.json

          echo "Tomorrow matches downloaded."

      # =========================================================
      # DAY 2
      # Runs only once per day
      # =========================================================

      - name: Get day 2 matches
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
        env:
          LFA_API_KEY: ${{ secrets.LFA_API_KEY }}
        run: |
          set -e

          DATE=$(TZ=Africa/Casablanca date -d "+2 days" +%F)

          echo "Getting day 2 matches: $DATE"

          curl --fail \
            --silent \
            --show-error \
            --get \
            "https://live-football-api.com/api/v1/matches" \
            --data-urlencode "api_key=$LFA_API_KEY" \
            --data-urlencode "date=$DATE" \
            --data-urlencode "lang=en" \
            -o fixtures/day2.json

          test -s fixtures/day2.json

          echo "Day 2 matches downloaded."

      # =========================================================
      # DAY 3
      # Runs only once per day
      # =========================================================

      - name: Get day 3 matches
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
        env:
          LFA_API_KEY: ${{ secrets.LFA_API_KEY }}
        run: |
          set -e

          DATE=$(TZ=Africa/Casablanca date -d "+3 days" +%F)

          echo "Getting day 3 matches: $DATE"

          curl --fail \
            --silent \
            --show-error \
            --get \
            "https://live-football-api.com/api/v1/matches" \
            --data-urlencode "api_key=$LFA_API_KEY" \
            --data-urlencode "date=$DATE" \
            --data-urlencode "lang=en" \
            -o fixtures/day3.json

          test -s fixtures/day3.json

          echo "Day 3 matches downloaded."

      # =========================================================
      # DAY 4
      # Runs only once per day
      # =========================================================

      - name: Get day 4 matches
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
        env:
          LFA_API_KEY: ${{ secrets.LFA_API_KEY }}
        run: |
          set -e

          DATE=$(TZ=Africa/Casablanca date -d "+4 days" +%F)

          echo "Getting day 4 matches: $DATE"

          curl --fail \
            --silent \
            --show-error \
            --get \
            "https://live-football-api.com/api/v1/matches" \
            --data-urlencode "api_key=$LFA_API_KEY" \
            --data-urlencode "date=$DATE" \
            --data-urlencode "lang=en" \
            -o fixtures/day4.json

          test -s fixtures/day4.json

          echo "Day 4 matches downloaded."

      # =========================================================
      # DAY 5
      # Runs only once per day
      # =========================================================

      - name: Get day 5 matches
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
        env:
          LFA_API_KEY: ${{ secrets.LFA_API_KEY }}
        run: |
          set -e

          DATE=$(TZ=Africa/Casablanca date -d "+5 days" +%F)

          echo "Getting day 5 matches: $DATE"

          curl --fail \
            --silent \
            --show-error \
            --get \
            "https://live-football-api.com/api/v1/matches" \
            --data-urlencode "api_key=$LFA_API_KEY" \
            --data-urlencode "date=$DATE" \
            --data-urlencode "lang=en" \
            -o fixtures/day5.json

          test -s fixtures/day5.json

          echo "Day 5 matches downloaded."

      # =========================================================
      # SAVE DATA
      # =========================================================

      - name: Save football data
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json
          git add fixtures/yesterday.json
          git add fixtures/tomorrow.json
          git add fixtures/day2.json
          git add fixtures/day3.json
          git add fixtures/day4.json
          git add fixtures/day5.json

          if git diff --cached --quiet; then
            echo "No changes in football data."
            exit 0
          fi

          git commit -m "Update GolHoyLive football data"

          git push

          echo "GolHoyLive football data saved successfully."
