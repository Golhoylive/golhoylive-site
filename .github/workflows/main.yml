name: Update GolHoyLive Football Data

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-football-data:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare folders
        run: |
          set -e
          mkdir -p fixtures

      - name: Get football matches
        env:
          LFA_API_KEY: ${{ secrets.LFA_API_KEY }}

        run: |
          set -e

          TODAY=$(TZ=Africa/Casablanca date +%F)
          YESTERDAY=$(TZ=Africa/Casablanca date -d "yesterday" +%F)
          TOMORROW=$(TZ=Africa/Casablanca date -d "tomorrow" +%F)

          echo "Today: $TODAY"
          echo "Yesterday: $YESTERDAY"
          echo "Tomorrow: $TOMORROW"

          echo "Getting today's matches..."

          curl --fail \
            --silent \
            --show-error \
            --get \
            "https://live-football-api.com/api/v1/matches" \
            --data-urlencode "api_key=$LFA_API_KEY" \
            --data-urlencode "date=$TODAY" \
            --data-urlencode "lang=en" \
            -o data.json

          test -s data.json

          echo "Today's matches downloaded."

          HOUR=$(TZ=Africa/Casablanca date +%H)
          HOUR_NUMBER=$((10#$HOUR))

          if [ $((HOUR_NUMBER % 6)) -eq 0 ]; then

            echo "Updating yesterday..."

            curl --fail \
              --silent \
              --show-error \
              --get \
              "https://live-football-api.com/api/v1/matches" \
              --data-urlencode "api_key=$LFA_API_KEY" \
              --data-urlencode "date=$YESTERDAY" \
              --data-urlencode "lang=en" \
              -o fixtures/yesterday.json

            test -s fixtures/yesterday.json

            echo "Updating tomorrow..."

            curl --fail \
              --silent \
              --show-error \
              --get \
              "https://live-football-api.com/api/v1/matches" \
              --data-urlencode "api_key=$LFA_API_KEY" \
              --data-urlencode "date=$TOMORROW" \
              --data-urlencode "lang=en" \
              -o fixtures/tomorrow.json

            test -s fixtures/tomorrow.json

            echo "Yesterday and tomorrow updated."

          else

            echo "Yesterday and tomorrow will be updated every 6 hours."

          fi

      - name: Get competitions
        env:
          LFA_API_KEY: ${{ secrets.LFA_API_KEY }}

        run: |
          set -e

          HOUR=$(TZ=Africa/Casablanca date +%H)
          HOUR_NUMBER=$((10#$HOUR))

          if [ $((HOUR_NUMBER % 6)) -eq 0 ]; then

            echo "Updating competitions..."

            curl --fail \
              --silent \
              --show-error \
              --get \
              "https://live-football-api.com/api/v1/leagues" \
              --data-urlencode "api_key=$LFA_API_KEY" \
              --data-urlencode "lang=en" \
              -o leagues.json

            test -s leagues.json

            echo "Competitions updated."

          else

            echo "Keeping existing leagues.json."

          fi

      - name: Save football data
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json
          git add leagues.json
          git add fixtures/

          if git diff --cached --quiet; then
            echo "No changes in football data."
            exit 0
          fi

          git commit -m "Update GolHoyLive football data"

          git push

          echo "GolHoyLive data saved successfully."
