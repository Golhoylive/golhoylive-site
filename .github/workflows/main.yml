name: Update GolHoyLive Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-football-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get football matches
        env:
          LFA_API_KEY: ${{ secrets.LFA_API_KEY }}
        run: |
          set -e

          DATE=$(TZ=Africa/Casablanca date +%F)

          curl --fail --silent --show-error --get \
            "https://live-football-api.com/api/v1/matches" \
            --data-urlencode "api_key=$LFA_API_KEY" \
            --data-urlencode "date=$DATE" \
            --data-urlencode "lang=en" \
            -o data.json

          test -s data.json

      - name: Save football data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No changes in football data."
            exit 0
          fi

          git commit -m "Update football data"
          git push
