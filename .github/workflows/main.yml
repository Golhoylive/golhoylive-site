name: Update GolHoyLive Football Data

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: "League ID - leave empty for normal update"
        required: false
        type: string

      season:
        description: "Season - leave empty for current season"
        required: false
        type: string

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-football-data:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # CREATE FIXTURES FOLDER
      # ==========================================

      - name: Prepare folders
        run: |
          set -e
          mkdir -p fixtures

      # ==========================================
      # TODAY'S MATCHES
      # ==========================================

      - name: Get today's football matches
        env:
          LFA_API_KEY: ${{ secrets.LFA_API_KEY }}
        run: |
          set -e

          DATE=$(TZ=Africa/Casablanca date +%F)

          echo "Getting football matches for $DATE"

          curl --fail \
            --silent \
            --show-error \
            --get \
            "https://live-football-api.com/api/v1/matches" \
            --data-urlencode "api_key=$LFA_API_KEY" \
            --data-urlencode "date=$DATE" \
            --data-urlencode "lang=en" \
            -o data.json

          test -s data.json

          echo "Today's football data downloaded successfully."

      # ==========================================
      # ALL COMPETITIONS
      # ==========================================

      - name: Get all competitions
        env:
          LFA_API_KEY: ${{ secrets.LFA_API_KEY }}
        run: |
          set -e

          echo "Getting all football competitions"

          curl --fail \
            --silent \
            --show-error \
            --get \
            "https://live-football-api.com/api/v1/leagues" \
            --data-urlencode "api_key=$LFA_API_KEY" \
            --data-urlencode "lang=en" \
            -o leagues.json

          test -s leagues.json

          echo "All competitions downloaded successfully."

      # ==========================================
      # SELECTED COMPETITION FULL FIXTURES
      # ==========================================

      - name: Get selected competition fixtures
        if: ${{ inputs.league_id != '' }}
        env:
          LFA_API_KEY: ${{ secrets.LFA_API_KEY }}
          LEAGUE_ID: ${{ inputs.league_id }}
          SEASON: ${{ inputs.season }}
        run: |
          set -e

          echo "Getting fixtures for league: $LEAGUE_ID"

          if [ -n "$SEASON" ]; then

            echo "Using season: $SEASON"

            curl --fail \
              --silent \
              --show-error \
              --get \
              "https://live-football-api.com/api/v1/league_fixtures" \
              --data-urlencode "api_key=$LFA_API_KEY" \
              --data-urlencode "league_id=$LEAGUE_ID" \
              --data-urlencode "season=$SEASON" \
              --data-urlencode "lang=en" \
              -o "fixtures/${LEAGUE_ID}.json"

          else

            echo "Using current season"

            curl --fail \
              --silent \
              --show-error \
              --get \
              "https://live-football-api.com/api/v1/league_fixtures" \
              --data-urlencode "api_key=$LFA_API_KEY" \
              --data-urlencode "league_id=$LEAGUE_ID" \
              --data-urlencode "lang=en" \
              -o "fixtures/${LEAGUE_ID}.json"

          fi

          test -s "fixtures/${LEAGUE_ID}.json"

          echo "Competition fixtures downloaded successfully."

      # ==========================================
      # SAVE DATA
      # ==========================================

      - name: Save football data
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json
          git add leagues.json
          git add fixtures

          if git diff --cached --quiet; then
            echo "No changes in football data."
            exit 0
          fi

          git commit -m "Update GolHoyLive football data"

          git push

          echo "Football data saved successfully."
