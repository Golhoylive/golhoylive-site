<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>GolHoyLive ⚽</title>

<style>

:root{
  --bg:#f7f8f9;
  --white:#ffffff;
  --dark:#062b35;
  --text:#10232b;
  --muted:#969ca0;
  --line:#e6e9eb;
  --pink:#ef0b5b;
  --yellow:#fff2c9;
  --gray:#eeeeee;
  --green:#19b56b;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

/* =========================
   TOP HEADER
========================= */

.topbar{
  height:76px;
  background:var(--dark);
  color:#fff;

  display:flex;
  align-items:center;

  padding:0 18px;
  gap:14px;

  position:sticky;
  top:0;
  z-index:50;
}

.menu-btn{
  width:42px;
  height:42px;

  border:0;
  background:none;

  color:#fff;
  font-size:29px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.brand{
  font-size:25px;
  font-weight:800;

  display:flex;
  align-items:center;

  white-space:nowrap;
}

.spacer{
  flex:1;
}

.search-btn{
  width:44px;
  height:44px;

  border:0;
  background:none;

  color:#fff;

  font-size:31px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.lang{
  border:0;
  background:none;
  color:#fff;

  font-size:13px;
  font-weight:bold;

  outline:none;
}

/* =========================
   DAYS
========================= */

.days{
  height:68px;

  background:#fff;

  display:flex;

  overflow-x:auto;

  border-bottom:1px solid var(--line);

  position:sticky;
  top:76px;
  z-index:45;
}

.days::-webkit-scrollbar{
  display:none;
}

.day{
  min-width:88px;
  flex:1;

  border:0;

  background:#fff;

  color:#62696d;

  padding:9px 5px 7px;

  text-align:center;

  position:relative;
}

.day small{
  display:block;

  font-size:12px;

  font-weight:800;

  margin-bottom:5px;
}

.day strong{
  display:block;

  font-size:16px;

  font-weight:800;
}

.day.active{
  color:var(--pink);
}

.day.active::after{
  content:"";

  position:absolute;

  bottom:0;
  left:14px;
  right:14px;

  height:4px;

  background:var(--pink);

  border-radius:4px 4px 0 0;
}

/* =========================
   MAIN
========================= */

.content{
  width:100%;
  max-width:950px;

  margin:0 auto;

  background:#fff;

  min-height:calc(100vh - 144px);

  padding-bottom:90px;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
  height:76px;

  background:#fff;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 22px;

  border-bottom:1px solid var(--line);
}

.allmatches{
  display:flex;

  align-items:center;

  gap:16px;

  font-size:20px;

  font-weight:800;
}

.list-icon{
  font-size:29px;
}

.count-area{
  display:flex;

  align-items:center;

  gap:9px;
}

.count{
  font-size:19px;

  color:#62696d;

  font-weight:700;
}

.live-count{
  background:var(--pink);

  color:#fff;

  border-radius:13px;

  padding:5px 9px;

  font-size:15px;

  font-weight:800;

  display:none;
}

/* =========================
   SECTION TITLE
========================= */

.section-title{
  background:var(--yellow);

  padding:12px 24px;

  color:#26343a;

  font-size:14px;

  font-weight:900;

  letter-spacing:.6px;
}

/* =========================
   COMPETITION ROW
========================= */

.competition{
  width:100%;

  min-height:94px;

  background:#fff;

  border:0;

  border-bottom:1px solid var(--line);

  display:flex;

  align-items:center;

  gap:16px;

  padding:13px 24px;

  text-align:left;
}

.competition:hover{
  background:#fafafa;
}

.flag{
  width:52px;

  flex:none;

  text-align:center;

  font-size:30px;
}

.competition-main{
  flex:1;

  min-width:0;
}

.country{
  color:#9a9da0;

  font-size:13px;

  font-weight:900;

  letter-spacing:.7px;

  text-transform:uppercase;

  margin-bottom:5px;
}

.competition-name{
  color:#10232b;

  font-size:20px;

  font-weight:800;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.competition-count{
  min-width:32px;

  text-align:center;

  color:#5d666b;

  font-size:18px;

  font-weight:700;
}

.favorite-btn{
  width:36px;
  height:36px;

  border:0;

  background:none;

  color:#b5b9bb;

  font-size:25px;

  flex:none;
}

.favorite-btn.active{
  color:#f3ae00;
}

/* =========================
   OTHER A-Z
========================= */

.az-title{
  background:var(--gray);

  color:#656c70;

  padding:12px 24px;

  font-size:14px;

  font-weight:900;

  letter-spacing:.5px;
}

/* =========================
   EMPTY
========================= */

.empty{
  padding:55px 20px;

  text-align:center;

  color:#9a9fa2;

  font-size:18px;
}

/* =========================
   MATCH PAGE
========================= */

.matches-page{
  background:#fff;
}

.matches-header{
  height:65px;

  display:flex;

  align-items:center;

  gap:12px;

  padding:0 18px;

  border-bottom:1px solid var(--line);
}

.back-btn{
  border:0;

  background:none;

  color:#26343a;

  font-size:31px;

  width:40px;
  height:40px;
}

.match-league-name{
  font-size:18px;

  font-weight:900;
}

.match-row{
  min-height:88px;

  display:grid;

  grid-template-columns:1fr 80px 1fr;

  align-items:center;

  gap:8px;

  padding:14px 13px;

  border-bottom:1px solid var(--line);

  direction:ltr;
}

.team{
  display:flex;

  align-items:center;

  gap:7px;

  font-size:15px;

  font-weight:700;

  line-height:1.2;
}

.team.home{
  justify-content:flex-end;

  text-align:right;
}

.team.away{
  justify-content:flex-start;

  text-align:left;
}

.team-logo{
  width:34px;
  height:34px;

  object-fit:contain;

  flex:none;
}

.match-middle{
  text-align:center;
}

.match-time{
  font-size:12px;

  color:#687176;

  font-weight:700;

  margin-bottom:4px;
}

.match-time.live{
  color:var(--pink);
}

.match-score{
  font-size:18px;

  font-weight:900;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;

  bottom:0;
  left:0;
  right:0;

  height:72px;

  background:#fff;

  border-top:1px solid #dfe2e4;

  display:flex;

  z-index:100;
}

.bottom-btn{
  flex:1;

  border:0;

  background:#fff;

  color:#9a9da0;

  font-size:11px;

  font-weight:900;

  padding:5px 2px;
}

.bottom-btn span{
  display:block;

  font-size:26px;

  line-height:31px;

  margin-bottom:1px;
}

.bottom-btn.active{
  color:var(--pink);
}

/* =========================
   SEARCH
========================= */

.search-box{
  position:fixed;

  top:76px;
  left:0;
  right:0;

  background:#fff;

  padding:12px;

  border-bottom:1px solid var(--line);

  z-index:60;

  display:none;
}

.search-box.show{
  display:block;
}

.search-input{
  width:100%;

  height:48px;

  border:1px solid #dfe3e5;

  border-radius:10px;

  padding:0 15px;

  outline:none;

  font-size:16px;
}

.search-input:focus{
  border-color:var(--pink);
}

/* =========================
   HIDDEN
========================= */

.hidden{
  display:none !important;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:701px){

  .content{
    box-shadow:0 0 30px rgba(0,0,0,.04);
  }

  .bottom-nav{
    max-width:950px;

    left:50%;

    right:auto;

    width:100%;

    transform:translateX(-50%);

    border-left:1px solid #ddd;

    border-right:1px solid #ddd;
  }

}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  .topbar{
    height:68px;

    padding:0 12px;

    gap:9px;
  }

  .brand{
    font-size:24px;
  }

  .days{
    top:68px;

    height:67px;
  }

  .day{
    min-width:82px;
  }

  .day strong{
    font-size:15px;
  }

  .toolbar{
    height:70px;

    padding:0 17px;
  }

  .allmatches{
    font-size:18px;

    gap:12px;
  }

  .competition{
    min-height:91px;

    padding:12px 17px;

    gap:12px;
  }

  .flag{
    width:45px;

    font-size:27px;
  }

  .competition-name{
    font-size:18px;
  }

  .country{
    font-size:12px;
  }

  .competition-count{
    font-size:17px;
  }

  .section-title,
  .az-title{
    padding-left:18px;
    padding-right:18px;
  }

  .match-row{
    grid-template-columns:1fr 68px 1fr;

    padding:13px 8px;
  }

  .team{
    font-size:13px;
  }

  .team-logo{
    width:31px;
    height:31px;
  }

}

/* =========================
   VERY SMALL SCREEN
========================= */

@media(max-width:350px){

  .brand{
    font-size:21px;
  }

  .competition-name{
    font-size:16px;
  }

  .competition{
    padding:11px 12px;
  }

  .match-row{
    grid-template-columns:1fr 60px 1fr;
  }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="topbar">

  <button
    class="menu-btn"
    id="menuBtn"
    aria-label="Menu"
  >
    ⚽
  </button>

  <div class="brand">
    Football
  </div>

  <div class="spacer"></div>

  <button
    class="search-btn"
    id="searchBtn"
    aria-label="Search"
  >
    🔍
  </button>

  <select
    class="lang"
    id="lang"
  >
    <option value="fr">FR</option>
    <option value="ar">AR</option>
    <option value="es">ES</option>
    <option value="en">EN</option>
    <option value="pt">PT</option>
  </select>

</header>


<!-- =========================
     SEARCH
========================= -->

<div
  class="search-box"
  id="searchBox"
>

  <input
    class="search-input"
    id="searchInput"
    type="text"
    placeholder="Rechercher une équipe ou compétition..."
  >

</div>


<!-- =========================
     DAYS
========================= -->

<div
  class="days"
  id="days"
></div>


<!-- =========================
     CONTENT
========================= -->

<main class="content">


  <!-- TOOLBAR -->

  <div class="toolbar">

    <div class="allmatches">

      <span class="list-icon">
        ☷
      </span>

      <span id="allMatchesText">
        Tous les matchs
      </span>

    </div>


    <div class="count-area">

      <span
        class="live-count"
        id="liveCount"
      >
      </span>

      <span
        class="count"
        id="totalCount"
      >
        0
      </span>

    </div>

  </div>


  <!-- FAVORITES -->

  <div
    class="section-title"
    id="favoritesTitle"
  >
    COMPÉTITIONS FAVORITES
  </div>


  <div
    id="favorites"
  >
  </div>


  <!-- A-Z -->

  <div
    class="az-title"
    id="azTitle"
  >
    AUTRES COMPÉTITIONS [A-Z]
  </div>


  <div
    id="leagues"
  >
  </div>


  <!-- MATCHES -->

  <div
    id="matches"
    class="hidden matches-page"
  >
  </div>


</main>


<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">


  <button
    class="bottom-btn active"
    data-page="all"
  >

    <span>
      ⚽
    </span>

    <label>
      Tous
    </label>

  </button>


  <button
    class="bottom-btn"
    data-page="live"
  >

    <span>
      ◉
    </span>

    <label>
      Direct
    </label>

  </button>


  <button
    class="bottom-btn"
    data-page="favorites"
  >

    <span>
      ☆
    </span>

    <label>
      Favoris
    </label>

  </button>


  <button
    class="bottom-btn"
    data-page="news"
  >

    <span>
      ▤
    </span>

    <label>
      Actualités
    </label>

  </button>


  <button
    class="bottom-btn"
    data-page="champions"
  >

    <span>
      🏆
    </span>

    <label>
      Champions
    </label>

  </button>


</nav>


<script>

/* =========================================================
   GOLHOYLIVE
   ========================================================= */


/* =========================
   STATE
========================= */

const state = {

  day: "today",

  page: "all",

  selectedCompetition: null,

  search: ""

};


/* =========================
   DATA
========================= */

const data = {

  today: [],

  yesterday: [],

  tomorrow: []

};


/* =========================
   FAVORITES
========================= */

const FAVORITES_KEY =
  "golhoylive_favorites";


let favorites =
  JSON.parse(
    localStorage.getItem(FAVORITES_KEY) || "[]"
  );


/* =========================
   TRANSLATIONS
========================= */

const translations = {

  fr: {

    all: "Tous les matchs",

    favorites: "COMPÉTITIONS FAVORITES",

    other: "AUTRES COMPÉTITIONS [A-Z]",

    search: "Rechercher une équipe ou compétition...",

    noMatches: "Aucun match",

    noFavorites: "Aucune compétition favorite",

    yesterday: "Hier",

    today: "Aujourd'hui",

    tomorrow: "Demain"

  },


  en: {

    all: "All matches",

    favorites: "FAVORITE COMPETITIONS",

    other: "OTHER COMPETITIONS [A-Z]",

    search: "Search team or competition...",

    noMatches: "No matches",

    noFavorites: "No favorite competitions",

    yesterday: "Yesterday",

    today: "Today",

    tomorrow: "Tomorrow"

  },


  es: {

    all: "Todos los partidos",

    favorites: "COMPETICIONES FAVORITAS",

    other: "OTRAS COMPETICIONES [A-Z]",

    search: "Buscar equipo o competición...",

    noMatches: "No hay partidos",

    noFavorites: "No hay competiciones favoritas",

    yesterday: "Ayer",

    today: "Hoy",

    tomorrow: "Mañana"

  },


  ar: {

    all: "جميع المباريات",

    favorites: "البطولات المفضلة",

    other: "باقي البطولات [A-Z]",

    search: "ابحث عن فريق أو بطولة...",

    noMatches: "لا توجد مباريات",

    noFavorites: "لا توجد بطولات مفضلة",

    yesterday: "الأمس",

    today: "اليوم",

    tomorrow: "غداً"

  },


  pt: {

    all: "Todos os jogos",

    favorites: "COMPETIÇÕES FAVORITAS",

    other: "OUTRAS COMPETIÇÕES [A-Z]",

    search: "Pesquisar equipa ou competição...",

    noMatches: "Sem jogos",

    noFavorites: "Sem competições favoritas",

    yesterday: "Ontem",

    today: "Hoje",

    tomorrow: "Amanhã"

  }

};


/* =========================
   CURRENT LANGUAGE
========================= */

let currentLang =
  localStorage.getItem("golhoylive_lang") || "fr";


function t(key){

  return (

    translations[currentLang] ||

    translations.fr

  )[key];

}


/* =========================
   NORMALIZE
========================= */

function normalize(value){

  return String(value || "")

    .toLowerCase()

    .normalize("NFD")

    .replace(/[\u0300-\u036f]/g, "")

    .trim();

}


/* =========================
   BLOCKED COMPETITIONS
========================= */

const BLOCKED = [

  "women",

  "woman",

  "womens",

  "women's",

  "femenil",

  "femenino",

  "female",

  "feminine",

  "ladies",

  "u17",

  "u18",

  "u19",

  "u20",

  "u21",

  "u22",

  "u23",

  "youth",

  "reserve",

  "reserves",

  "amateur",

  "regional"

];


/* =========================
   COMPETITION FILTER
========================= */

function isAllowedCompetition(match){

  const league =
    match?.league || {};

  const name =
    normalize(league.name);

  if(
    BLOCKED.some(
      word =>
        name.includes(
          normalize(word)
        )
    )
  ){

    return false;

  }

  return true;

}


/* =========================
   DAY MATCHES
========================= */

function getMatches(day){

  return (

    data[day] || []

  ).filter(
    isAllowedCompetition
  );

}


/* =========================
   ALL MATCHES
========================= */

function getAllMatches(){

  return [

    ...data.yesterday,

    ...data.today,

    ...data.tomorrow

  ].filter(
    isAllowedCompetition
  );

}


/* =========================
   FLAG
========================= */

const FLAGS = {

  Africa: "🌍",

  Argentina: "🇦🇷",

  Australia: "🇦🇺",

  Austria: "🇦🇹",

  Belgium: "🇧🇪",

  Brazil: "🇧🇷",

  Canada: "🇨🇦",

  Chile: "🇨🇱",

  Colombia: "🇨🇴",

  Denmark: "🇩🇰",

  Ecuador: "🇪🇨",

  England: "🏴",

  Europe: "🇪🇺",

  France: "🇫🇷",

  Germany: "🇩🇪",

  Greece: "🇬🇷",

  Italy: "🇮🇹",

  Japan: "🇯🇵",

  Mexico: "🇲🇽",

  Morocco: "🇲🇦",

  Netherlands: "🇳🇱",

  Norway: "🇳🇴",

  Portugal: "🇵🇹",

  SaudiArabia: "🇸🇦",

  "Saudi Arabia": "🇸🇦",

  Scotland: "🏴",

Serbia: "🇷🇸",
Spain: "🇪🇸",
Sweden: "🇸🇪",
Switzerland: "🇨🇭",
Turkey: "🇹🇷",
USA: "🇺🇸",
"United States": "🇺🇸",
Uruguay: "🇺🇾",
World: "🌎",
"South America": "🌎",
"North America": "🌎",
Asia: "🌏"

};


/* =========================
   GET FLAG
========================= */

function getFlag(country){

  return FLAGS[country] || "🌐";

}


/* =========================
   DATE HELPERS
========================= */

function dateForOffset(offset){

  const d = new Date();

  d.setDate(d.getDate() + offset);

  return d;

}


function dateText(d){

  return String(d.getDate()).padStart(2,"0")
    + "."
    + String(d.getMonth()+1).padStart(2,"0");

}


function weekday(d){

  const names = [
    "DI","LU","MA","ME","JE","VE","SA"
  ];

  return names[d.getDay()];

}


/* =========================
   DAYS
========================= */

function renderDays(){

  const container =
    document.getElementById("days");

  const definitions = [
    ["yesterday",-1],
    ["today",0],
    ["tomorrow",1]
  ];

  container.innerHTML =
    definitions.map(([key,offset]) => {

      const d = dateForOffset(offset);

      return `
        <button
          class="day ${state.day === key ? "active" : ""}"
          data-day="${key}"
        >
          <small>${weekday(d)}</small>
          <strong>${dateText(d)}</strong>
        </button>
      `;

    }).join("");


  container
    .querySelectorAll(".day")
    .forEach(button => {

      button.onclick = () => {

        state.day = button.dataset.day;
        state.selectedCompetition = null;

        renderDays();
        render();

      };

    });

}


/* =========================
   GROUP COMPETITIONS
========================= */

function getCompetitionGroups(day){

  const matches = getMatches(day);

  const map = new Map();

  matches.forEach(match => {

    const league = match.league || {};

    const id =
      league.id ||
      normalize(
        (league.country || "World")
        + "-"
        + (league.name || "Unknown")
      );

    if(!map.has(id)){

      map.set(id,{
        id:id,
        name:league.name || "Unknown",
        country:league.country || "World",
        matches:[]
      });

    }

    map.get(id).matches.push(match);

  });


  return [...map.values()].sort(
    (a,b) =>
      a.name.localeCompare(b.name)
  );

}


/* =========================
   FAVORITES
========================= */

function saveFavorites(){

  localStorage.setItem(
    FAVORITES_KEY,
    JSON.stringify(favorites)
  );

}


function toggleFavorite(id,event){

  event.stopPropagation();

  if(favorites.includes(id)){

    favorites =
      favorites.filter(x => x !== id);

  }else{

    favorites.push(id);

  }

  saveFavorites();

  render();

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   COMPETITION HTML
========================= */

function competitionHTML(competition){

  const isFavorite =
    favorites.includes(competition.id);

  return `

    <div
      class="competition"
      data-id="${escapeHTML(competition.id)}"
    >

      <div class="flag">
        ${getFlag(competition.country)}
      </div>

      <div class="competition-main">

        <div class="country">
          ${escapeHTML(competition.country)}
        </div>

        <div class="competition-name">
          ${escapeHTML(competition.name)}
        </div>

      </div>

      <button
        class="favorite-btn ${isFavorite ? "active" : ""}"
        data-favorite="${escapeHTML(competition.id)}"
      >
        ${isFavorite ? "★" : "☆"}
      </button>

      <div class="competition-count">
        ${competition.matches.length}
      </div>

    </div>

  `;

}


/* =========================
   COUNTS
========================= */

function updateCounts(total,live){

  document.getElementById("totalCount")
    .textContent = total;

  const liveElement =
    document.getElementById("liveCount");

  if(live > 0){

    liveElement.style.display = "inline-block";
    liveElement.textContent = live;

  }else{

    liveElement.style.display = "none";

  }

}


/* =========================
   EVENTS
========================= */

function bindCompetitionEvents(){

  document
    .querySelectorAll(".competition")
    .forEach(element => {

      element.onclick = () => {

        state.selectedCompetition =
          element.dataset.id;

        render();

      };

    });


  document
    .querySelectorAll("[data-favorite]")
    .forEach(button => {

      button.onclick = event => {

        toggleFavorite(
          button.dataset.favorite,
          event
        );

      };

    });

}


/* =========================
   MAIN COMPETITIONS
========================= */

function renderCompetitions(){

  const groups =
    getCompetitionGroups(state.day);

  let filtered = groups;


  if(state.search){

    const q = normalize(state.search);

    filtered =
      groups.filter(competition =>

        normalize(competition.name).includes(q)

        ||

        normalize(competition.country).includes(q)

        ||

        competition.matches.some(match =>

          normalize(match?.home?.name).includes(q)

          ||

          normalize(match?.away?.name).includes(q)

        )

      );

  }


  const favoriteGroups =
    filtered.filter(
      competition =>
        favorites.includes(competition.id)
    );


  const otherGroups =
    filtered.filter(
      competition =>
        !favorites.includes(competition.id)
    );


  const total =
    filtered.reduce(
      (sum,competition) =>
        sum + competition.matches.length,
      0
    );


  const live =
    filtered
      .flatMap(
        competition =>
          competition.matches
      )
      .filter(
        match =>
          match?.status?.is_live === true
      ).length;


  updateCounts(total,live);


  document.getElementById("favorites")
    .innerHTML =
      favoriteGroups.length

      ?

      favoriteGroups
        .map(competitionHTML)
        .join("")

      :

      `<div class="empty">
        ${t("noFavorites")}
      </div>`;


  document.getElementById("leagues")
    .innerHTML =
      otherGroups.length

      ?

      otherGroups
        .map(competitionHTML)
        .join("")

      :

      `<div class="empty">
        ${t("noMatches")}
      </div>`;


  document.getElementById("favoritesTitle")
    .style.display = "block";


  document.getElementById("azTitle")
    .style.display =
      otherGroups.length
      ? "block"
      : "none";


  document.getElementById("matches")
    .classList.add("hidden");


  bindCompetitionEvents();

}


/* =========================
   MATCH HTML
========================= */

function matchHTML(match){

  const home = match.home || {};
  const away = match.away || {};

  const live =
    match?.status?.is_live === true;

  const homeScore =
    home.score == null ? "-" : home.score;

  const awayScore =
    away.score == null ? "-" : away.score;

  return `

    <div class="match-row">

      <div class="team home">

        <span>
          ${escapeHTML(home.name || "-")}
        </span>

        ${
          home.logo
          ?
          `<img
            class="team-logo"
            src="${escapeHTML(home.logo)}"
            alt=""
          >`
          :
          ""
        }

      </div>


      <div class="match-middle">

        <div class="match-time ${live ? "live" : ""}">
          ${live ? "🔴 LIVE" : escapeHTML(match.kickoff || "--:--")}
        </div>

        <div class="match-score">
          ${homeScore} - ${awayScore}
        </div>

      </div>


      <div class="team away">

        ${
          away.logo
          ?
          `<img
            class="team-logo"
            src="${escapeHTML(away.logo)}"
            alt=""
          >`
          :
          ""
        }

        <span>
          ${escapeHTML(away.name || "-")}
        </span>

      </div>

    </div>

  `;

}


/* =========================
   COMPETITION MATCHES
========================= */

function renderCompetitionMatches(){

  const groups =
    getCompetitionGroups(state.day);

  const competition =
    groups.find(
      group =>
        group.id === state.selectedCompetition
    );


  if(!competition){

    state.selectedCompetition = null;

    render();

    return;

  }


  updateCounts(
    competition.matches.length,
    competition.matches.filter(
      match => match?.status?.is_live
    ).length
  );


  document.getElementById("favorites")
    .innerHTML = "";

  document.getElementById("leagues")
    .innerHTML = "";

  document.getElementById("favoritesTitle")
    .style.display = "none";

  document.getElementById("azTitle")
    .style.display = "none";


  const box =
    document.getElementById("matches");


  box.classList.remove("hidden");


  box.innerHTML = `

    <div class="matches-header">

      <button
        class="back-btn"
        id="backBtn"
      >
        ‹
      </button>

      <div>

        <div class="country">
          ${escapeHTML(competition.country)}
        </div>

        <div class="match-league-name">
          ${escapeHTML(competition.name)}
        </div>

      </div>

    </div>


    ${
      competition.matches
        .map(matchHTML)
        .join("")
    }

  `;


  document.getElementById("backBtn")
    .onclick = () => {

      state.selectedCompetition = null;

      render();

    };

}


/* =========================
   LIVE
========================= */

function renderLive(){

  const live =
    getAllMatches().filter(
      match =>
        match?.status?.is_live === true
    );


  const map = new Map();


  live.forEach(match => {

    const league =
      match.league || {};

    const id =
      league.id ||
      normalize(league.name);


    if(!map.has(id)){

      map.set(id,{
        id:id,
        name:league.name || "Unknown",
        country:league.country || "World",
        matches:[]
      });

    }

    map.get(id).matches.push(match);

  });


  const groups =
    [...map.values()];


  updateCounts(
    live.length,
    live.length
  );


  document.getElementById("favoritesTitle")
    .style.display = "block";

  document.getElementById("azTitle")
    .style.display = "none";


  document.getElementById("favorites")
    .innerHTML =

      groups.length

      ?

      groups
        .map(competitionHTML)
        .join("")

      :

      `<div class="empty">
        ${t("noMatches")}
      </div>`;


  document.getElementById("leagues")
    .innerHTML = "";


  document.getElementById("matches")
    .classList.add("hidden");


  bindCompetitionEvents();

}


/* =========================
   FAVORITES PAGE
========================= */

function renderFavoritesPage(){

  const groups =
    getCompetitionGroups(state.day)
      .filter(
        group =>
          favorites.includes(group.id)
      );


  const total =
    groups.reduce(
      (sum,group) =>
        sum + group.matches.length,
      0
    );


  updateCounts(total,0);


  document.getElementById("favoritesTitle")
    .style.display = "block";

  document.getElementById("azTitle")
    .style.display = "none";


  document.getElementById("favorites")
    .innerHTML =

      groups.length

      ?

      groups
        .map(competitionHTML)
        .join("")

      :

      `<div class="empty">
        ${t("noFavorites")}
      </div>`;


  document.getElementById("leagues")
    .innerHTML = "";

  document.getElementById("matches")
    .classList.add("hidden");

  bindCompetitionEvents();

}


/* =========================
   RENDER
========================= */

function render(){

  if(state.selectedCompetition){

    renderCompetitionMatches();

    return;

  }


  if(state.page === "live"){

    renderLive();

    return;

  }


  if(state.page === "favorites"){

    renderFavoritesPage();

    return;

  }


  renderCompetitions();

}


/* =========================
   PAGE NAVIGATION
========================= */

function setPage(page){

  state.page = page;

  state.selectedCompetition = null;

  document
    .querySelectorAll(".bottom-btn")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.page === page
      );

    });

  render();

}


document
  .querySelectorAll(".bottom-btn")
  .forEach(button => {

    button.onclick = () => {

      setPage(
        button.dataset.page
      );

    };

  });


/* =========================
   SEARCH
========================= */

document
  .getElementById("searchBtn")
  .onclick = () => {

    const box =
      document.getElementById("searchBox");

    box.classList.toggle("show");

    if(box.classList.contains("show")){

      document
        .getElementById("searchInput")
        .focus();

    }

  };


document
  .getElementById("searchInput")
  .oninput = event => {

    state.search =
      event.target.value;

    state.page = "all";

    state.selectedCompetition = null;

    render();

  };


/* =========================
   LANGUAGE
========================= */

document
  .getElementById("lang")
  .value = currentLang;


document
  .getElementById("lang")
  .onchange = event => {

    currentLang =
      event.target.value;

    localStorage.setItem(
      "golhoylive_lang",
      currentLang
    );

    applyLanguage();

    render();

  };


function applyLanguage(){

  document.getElementById("allMatchesText")
    .textContent = t("all");

  document.getElementById("favoritesTitle")
    .textContent = t("favorites");

  document.getElementById("azTitle")
    .textContent = t("other");

  document.getElementById("searchInput")
    .placeholder = t("search");

}


/* =========================
   LOAD DATA
========================= */

async function loadFile(path){

  try{

    const response =
      await fetch(
        path + "?v=" + Date.now()
      );

    if(!response.ok){

      console.error(
        "File not found:",
        path
      );

      return [];

    }

    const json =
      await response.json();


    if(
      json?.data?.matches &&
      Array.isArray(json.data.matches)
    ){

      return json.data.matches;

    }


    if(
      json?.matches &&
      Array.isArray(json.matches)
    ){

      return json.matches;

    }


    return [];

  }catch(error){

    console.error(
      "GolHoyLive error:",
      path,
      error
    );

    return [];

  }

}


/* =========================
   LOAD
========================= */

async function load(){

  renderDays();

  applyLanguage();


  const results =
    await Promise.all([

      loadFile("data.json"),

      loadFile("fixtures/yesterday.json"),

      loadFile("fixtures/tomorrow.json")

    ]);


  data.today =
    results[0] || [];

  data.yesterday =
    results[1] || [];

  data.tomorrow =
    results[2] || [];


  console.log(
    "GolHoyLive loaded:",
    {
      today:data.today.length,
      yesterday:data.yesterday.length,
      tomorrow:data.tomorrow.length
    }
  );


  render();

}


/* =========================
   START
========================= */

load();

</script>
