<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07110d">
<title>GolHoyLive — Football Live Scores</title>
<meta name="description" content="GolHoyLive - Live football scores, results, fixtures, competitions and teams from around the world.">

<style>
:root{
  --bg:#050908;
  --panel:#0b1511;
  --panel2:#101d17;
  --line:#1d3027;
  --text:#f4fff8;
  --muted:#8fa69a;
  --green:#31f27b;
  --green2:#13c85d;
  --red:#ff4d5e;
  --yellow:#ffd34d;
  --blue:#55a7ff;
  --radius:18px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.top{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(5,9,8,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
}

.top-inner{
  max-width:1250px;
  margin:auto;
  padding:13px 16px;
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:900;
  font-size:21px;
  white-space:nowrap;
}

.ball{
  width:34px;
  height:34px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#10291b;
  border:1px solid #28553a;
  box-shadow:0 0 20px rgba(49,242,123,.15);
}

.logo b{
  color:var(--green);
}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  background:#0b1310;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px 14px 12px 40px;
  outline:none;
}

.search input:focus{
  border-color:#2b6645;
}

.search-icon{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}

.lang{
  background:#0b1310;
  border:1px solid var(--line);
  color:var(--text);
  padding:10px 11px;
  border-radius:12px;
}

.main{
  max-width:1250px;
  margin:auto;
  padding:18px 16px 100px;
}

.nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
  scrollbar-width:none;
}

.nav::-webkit-scrollbar{
  display:none;
}

.nav button{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:#0b1511;
  color:#b9c9c1;
  border-radius:12px;
  padding:10px 14px;
}

.nav button.active{
  color:#041008;
  background:var(--green);
  border-color:var(--green);
  font-weight:800;
}

.hero{
  margin-top:15px;
  border:1px solid var(--line);
  background:
    radial-gradient(circle at 85% 10%,rgba(49,242,123,.13),transparent 35%),
    linear-gradient(135deg,#0d1c14,#08100c);
  border-radius:22px;
  padding:22px;
}

.hero h1{
  margin:0 0 7px;
  font-size:30px;
}

.hero p{
  color:var(--muted);
  margin:0;
  line-height:1.6;
}

.datebar{
  display:flex;
  gap:8px;
  margin-top:17px;
  overflow-x:auto;
}

.datebar button{
  min-width:105px;
  padding:12px 14px;
  border-radius:13px;
  border:1px solid var(--line);
  background:#0a120f;
  color:#c7d5ce;
}

.datebar button.active{
  background:#173522;
  border-color:#2f794b;
  color:var(--green);
}

.section{
  margin-top:22px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.section-head h2{
  margin:0;
  font-size:20px;
}

.section-head span{
  color:var(--muted);
  font-size:13px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:15px;
}

.card.click{
  cursor:pointer;
  transition:.18s transform,.18s border-color;
}

.card.click:hover{
  transform:translateY(-2px);
  border-color:#2b5b3d;
}

.league-card{
  display:flex;
  align-items:center;
  gap:12px;
}

.league-logo{
  width:48px;
  height:48px;
  border-radius:13px;
  background:#13231a;
  display:grid;
  place-items:center;
  overflow:hidden;
  flex:0 0 auto;
}

.league-logo img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.league-name{
  font-weight:800;
}

.league-country{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.matches{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.match{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
}

.match-head{
  padding:10px 13px;
  background:#0e1914;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.match-league{
  color:#b8c9c0;
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.status{
  font-size:11px;
  font-weight:900;
  padding:5px 8px;
  border-radius:8px;
  white-space:nowrap;
}

.status.live{
  background:rgba(255,77,94,.13);
  color:#ff7380;
}

.status.finished{
  background:#1a2520;
  color:#9cadA3;
}

.status.soon{
  background:rgba(49,242,123,.10);
  color:var(--green);
}

.match-body{
  padding:15px;
  display:grid;
  grid-template-columns:1fr 80px 1fr;
  align-items:center;
  gap:10px;
}

.team{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.team.away{
  justify-content:flex-end;
  text-align:right;
}

.team-logo{
  width:35px;
  height:35px;
  border-radius:50%;
  object-fit:contain;
  background:#111b16;
  flex:0 0 auto;
}

.team-name{
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.score{
  text-align:center;
}

.score-main{
  font-size:22px;
  font-weight:900;
}

.score-time{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.center{
  text-align:center;
}

.empty{
  padding:35px 20px;
  text-align:center;
  background:var(--panel);
  border:1px dashed #274035;
  border-radius:18px;
  color:var(--muted);
}

.loading{
  padding:30px;
  text-align:center;
  color:var(--muted);
}

.spinner{
  width:30px;
  height:30px;
  margin:0 auto 12px;
  border:3px solid #1c3126;
  border-top-color:var(--green);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.country-title{
  margin:20px 0 9px;
  color:var(--green);
  font-size:14px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:13px;
}

.tabs button{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:#0b1511;
  color:#aebeb6;
  padding:9px 12px;
  border-radius:10px;
}

.tabs button.active{
  color:#041008;
  background:var(--green);
  border-color:var(--green);
}

.back{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-bottom:15px;
  border:1px solid var(--line);
  background:#0b1511;
  color:#c9d5cf;
  border-radius:11px;
  padding:9px 12px;
}

.competition-header{
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--panel);
  border:1px solid var(--line);
  padding:16px;
  border-radius:18px;
  margin-bottom:14px;
}

.competition-header .league-logo{
  width:62px;
  height:62px;
}

.competition-header h1{
  margin:0;
  font-size:23px;
}

.competition-header p{
  margin:5px 0 0;
  color:var(--muted);
}

.filter-row{
  display:flex;
  gap:8px;
  margin-bottom:13px;
}

.filter-row input{
  flex:1;
  min-width:0;
  background:#0b1511;
  border:1px solid var(--line);
  color:var(--text);
  padding:11px 13px;
  border-radius:11px;
  outline:none;
}

.badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:7px;
  background:#14261b;
  color:var(--green);
  font-size:11px;
  font-weight:800;
}

.footer{
  max-width:1250px;
  margin:0 auto;
  padding:30px 16px 50px;
  color:#66786f;
  text-align:center;
  font-size:12px;
}

.hidden{
  display:none!important;
}

@media(max-width:900px){
  .cards{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:650px){
  .top-inner{
    flex-wrap:wrap;
  }

  .logo{
    order:1;
  }

  .lang{
    order:2;
    margin-left:auto;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .main{
    padding:13px 11px 80px;
  }

  .hero{
    padding:17px;
    border-radius:17px;
  }

  .hero h1{
    font-size:24px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .match-body{
    grid-template-columns:1fr 65px 1fr;
  }

  .team-name{
    font-size:13px;
  }
}
</style>
</head>

<body>

<header class="top">
  <div class="top-inner">
    <a class="logo" href="#" onclick="goHome();return false;">
      <span class="ball">⚽</span>
      <span>GolHoy<b>Live</b></span>
    </a>

    <div class="search">
      <span class="search-icon">⌕</span>
      <input id="searchInput" type="search" placeholder="Search teams, leagues..." oninput="searchSite(this.value)">
    </div>

    <select id="language" class="lang" onchange="changeLanguage(this.value)">
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="ar">العربية</option>
      <option value="pt">Português</option>
    </select>
  </div>
</header>

<main class="main">

  <nav class="nav" id="nav">
    <button data-page="home" class="active" onclick="showPage('home')">🏠 Home</button>
    <button data-page="live" onclick="showPage('live')">🔴 Live</button>
    <button data-page="competitions" onclick="showPage('competitions')">🏆 Competitions</button>
    <button data-page="teams" onclick="showPage('teams')">👕 Teams</button>
  </nav>

  <section id="app"></section>

</main>

<footer class="footer">
  © <span id="year"></span> GolHoyLive — Football worldwide
</footer>

<script>
/*
  GolHoyLive
  ---------------------------------
  The API key is NEVER placed here.
  GitHub Actions downloads the API data
  into public JSON files.
*/

const state = {
  page: "home",
  day: "today",
  matches: [],
  leagues: [],
  countries: [],
  selectedLeague: null,
  search: "",
  loading: false,
  error: null,
  language: localStorage.getItem("ghl_lang") || detectLanguage()
};

const T = {
  en:{
    home:"Home",
    live:"Live",
    competitions:"Competitions",
    teams:"Teams",
    today:"Today",
    yesterday:"Yesterday",
    tomorrow:"Tomorrow",
    liveMatches:"Live matches",
    allMatches:"All matches",
    noMatches:"No matches found",
    noCompetition:"No matches found for this competition.",
    search:"Search teams, leagues...",
    allCompetitions:"All competitions",
    countries:"Countries",
    back:"Back",
    fixtures:"Fixtures",
    results:"Results",
    loading:"Loading...",
    worldwide:"Football worldwide",
    nationalTeams:"National teams",
    clubs:"Club football",
    unknown:"Football"
  },
  es:{
    home:"Inicio",
    live:"En directo",
    competitions:"Competiciones",
    teams:"Equipos",
    today:"Hoy",
    yesterday:"Ayer",
    tomorrow:"Mañana",
    liveMatches:"Partidos en directo",
    allMatches:"Todos los partidos",
    noMatches:"No hay partidos",
    noCompetition:"No hay partidos para esta competición.",
    search:"Buscar equipos, ligas...",
    allCompetitions:"Todas las competiciones",
    countries:"Países",
    back:"Volver",
    fixtures:"Calendario",
    results:"Resultados",
    loading:"Cargando...",
    worldwide:"Fútbol mundial",
    nationalTeams:"Selecciones",
    clubs:"Fútbol de clubes",
    unknown:"Fútbol"
  },
  fr:{
    home:"Accueil",
    live:"En direct",
    competitions:"Compétitions",
    teams:"Équipes",
    today:"Aujourd'hui",
    yesterday:"Hier",
    tomorrow:"Demain",
    liveMatches:"Matchs en direct",
    allMatches:"Tous les matchs",
    noMatches:"Aucun match",
    noCompetition:"Aucun match pour cette compétition.",
    search:"Rechercher équipes, ligues...",
    allCompetitions:"Toutes les compétitions",
    countries:"Pays",
    back:"Retour",
    fixtures:"Calendrier",
    results:"Résultats",
    loading:"Chargement...",
    worldwide:"Football mondial",
    nationalTeams:"Sélections",
    clubs:"Football de clubs",
    unknown:"Football"
  },
  ar:{
    home:"الرئيسية",
    live:"مباشر",
    competitions:"البطولات",
    teams:"الفرق",
    today:"اليوم",
    yesterday:"أمس",
    tomorrow:"غداً",
    liveMatches:"المباريات المباشرة",
    allMatches:"جميع المباريات",
    noMatches:"لا توجد مباريات",
    noCompetition:"لا توجد مباريات لهذه البطولة.",
    search:"ابحث عن فريق أو بطولة...",
    allCompetitions:"جميع البطولات",
    countries:"الدول",
    back:"رجوع",
    fixtures:"المباريات",
    results:"النتائج",
    loading:"جاري التحميل...",
    worldwide:"كرة القدم العالمية",
    nationalTeams:"المنتخبات",
    clubs:"كرة قدم الأندية",
    unknown:"كرة القدم"
  },
  pt:{
    home:"Início",
    live:"Ao vivo",
    competitions:"Competições",
    teams:"Equipas",
    today:"Hoje",
    yesterday:"Ontem",
    tomorrow:"Amanhã",
    liveMatches:"Jogos ao vivo",
    allMatches:"Todos os jogos",
    noMatches:"Nenhum jogo encontrado",
    noCompetition:"Nenhum jogo encontrado nesta competição.",
    search:"Pesquisar equipas, ligas...",
    allCompetitions:"Todas as competições",
    countries:"Países",
    back:"Voltar",
    fixtures:"Calendário",
    results:"Resultados",
    loading:"A carregar...",
    worldwide:"Futebol mundial",
    nationalTeams:"Seleções",
    clubs:"Futebol de clubes",
    unknown:"Futebol"
  }
};

function detectLanguage(){
  const lang = (navigator.language || "en").toLowerCase();

  if(lang.startsWith("ar")) return "ar";
  if(lang.startsWith("es")) return "es";
  if(lang.startsWith("fr")) return "fr";
  if(lang.startsWith("pt")) return "pt";

  return "en";
}

function tr(key){
  return (T[state.language] && T[state.language][key]) || T.en[key] || key;
}

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function logo(url){
  if(!url) return "";
  return String(url);
}

function normalizeStatus(match){
  const s = String(
    match?.status?.status ||
    match?.status?.state ||
    ""
  ).toLowerCase();

  if(
    match?.status?.is_live === true ||
    s === "live" ||
    s === "inplay" ||
    s === "in_play"
  ){
    return "LIVE";
  }

  if(
    s === "finished" ||
    s === "ft" ||
    s === "postgame" ||
    s === "ended" ||
    s === "complete"
  ){
    return "FINISHED";
  }

  return "SOON";
}

function normalizeMatch(m){
  return {
    id:m?.id || Math.random().toString(36),
    leagueId:m?.league?.id || "",
    league:m?.league?.name || tr("unknown"),
    country:m?.league?.country || "",
    week:m?.week || "",
    kickoff:m?.kickoff || "",
    status:normalizeStatus(m),
    display:m?.status?.display || m?.kickoff || "",
    home:{
      id:m?.home?.id || "",
      name:m?.home?.name || "Home",
      logo:m?.home?.logo || "",
      score:m?.home?.score ?? null
    },
    away:{
      id:m?.away?.id || "",
      name:m?.away?.name || "Away",
      logo:m?.away?.logo || "",
      score:m?.away?.score ?? null
    },
    halftime:m?.halftime || null,
    penalty:m?.penalty || null,
    tv:m?.tv_broadcast || false
  };
}

async function getJSON(file){
  const r = await fetch(file + "?ts=" + Date.now(), {
    cache:"no-store"
  });

  if(!r.ok){
    throw new Error(file + " HTTP " + r.status);
  }

  return await r.json();
}

async function loadData(){
  state.loading = true;
  state.error = null;
  render();

  try{
    const results = await Promise.allSettled([
      getJSON("data.json"),
      getJSON("leagues.json")
    ]);

    if(results[0].status === "fulfilled"){
      const payload = results[0].value;

      if(
        payload &&
        payload.success &&
        payload.data &&
        Array.isArray(payload.data.matches)
      ){
        state.matches = payload.data.matches.map(normalizeMatch);
      }else{
        state.matches = [];
      }
    }else{
      state.matches = [];
    }

    if(results[1].status === "fulfilled"){
      const payload = results[1].value;

      if(
        payload &&
        payload.success &&
        payload.data &&
        Array.isArray(payload.data.data)
      ){
        state.countries = payload.data.data;
        state.leagues = [];

        state.countries.forEach(countryBlock=>{
          (countryBlock.leagues || []).forEach(league=>{
            state.leagues.push({
              id:league.id,
              name:league.name,
              logo:league.logo || "",
              country:countryBlock.country || ""
            });
          });
        });
      }
    }

    state.loading = false;
    render();

  }catch(error){
    console.error(error);
    state.loading = false;
    state.error = error.message;
    render();
  }
}

function getCurrentMatches(){
  return state.matches.slice().sort((a,b)=>{
    const order = {
      LIVE:0,
      SOON:1,
      FINISHED:2
    };

    return (order[a.status] ?? 9) - (order[b.status] ?? 9);
  });
}

function statusHTML(m){
  if(m.status === "LIVE"){
    return '<span class="status live">🔴 ' + esc(m.display || "LIVE") + '</span>';
  }

  if(m.status === "FINISHED"){
    return '<span class="status finished">FT</span>';
  }

  return '<span class="status soon">' + esc(m.kickoff || m.display || "—") + '</span>';
}

function teamHTML(team, away=false){
  const image = team.logo
    ? '<img class="team-logo" src="' + esc(logo(team.logo)) + '" onerror="this.style.display=\'none\'">'
    : '<span class="team-logo"></span>';

  return `
    <div class="team ${away ? "away":""}">
      ${away ? `<span class="team-name">${esc(team.name)}</span>${image}` : `${image}<span class="team-name">${esc(team.name)}</span>`}
    </div>
  `;
}

function matchHTML(m){
  const hs = m.home.score == null ? "-" : esc(m.home.score);
  const as = m.away.score == null ? "-" : esc(m.away.score);

  return `
    <article class="match">
      <div class="match-head">
        <span class="match-league">
          ${esc(m.league)}
          ${m.country ? " · " + esc(m.country) : ""}
        </span>
        ${statusHTML(m)}
      </div>

      <div class="match-body">
        ${teamHTML(m.home,false)}

        <div class="score">
          <div class="score-main">${hs} - ${as}</div>
          <div class="score-time">
            ${m.status === "LIVE" ? esc(m.display || "LIVE") : esc(m.status === "FINISHED" ? "FT" : (m.kickoff || "—"))}
          </div>
        </div>

        ${teamHTML(m.away,true)}
      </div>
    </article>
  `;
}

function matchesHTML(matches, emptyText){
  if(!matches.length){
    return `<div class="empty">${esc(emptyText || tr("noMatches"))}</div>`;
  }

  return `<div class="matches">${matches.map(matchHTML).join("")}</div>`;
}

function homePage(){
  const matches = getCurrentMatches();
  const live = matches.filter(m=>m.status==="LIVE");

  return `
    <div class="hero">
      <h1>⚽ GolHoyLive</h1>
      <p>${esc(tr("worldwide"))} — live scores, results, competitions and fixtures.</p>

      <div class="datebar">
        <button class="${state.day==="yesterday"?"active":""}" onclick="changeDay('yesterday')">← ${esc(tr("yesterday"))}</button>
        <button class="${state.day==="today"?"active":""}" onclick="changeDay('today')">${esc(tr("today"))}</button>
        <button class="${state.day==="tomorrow"?"active":""}" onclick="changeDay('tomorrow')">${esc(tr("tomorrow"))} →</button>
      </div>
    </div>

    <section class="section">
      <div class="section-head">
        <h2>${live.length ? "🔴 " + esc(tr("liveMatches")) : "⚽ " + esc(tr("allMatches"))}</h2>
        <span>${matches.length} matches</span>
      </div>

      ${matchesHTML(matches)}
    </section>

    <section class="section">
      <div class="section-head">
        <h2>🏆 ${esc(tr("competitions"))}</h2>
        <span>${state.leagues.length}</span>
      </div>

      ${competitionPreview()}
    </section>
  `;
}

function livePage(){
  const live = state.matches.filter(m=>m.status==="LIVE");

  return `
    <div class="section">
      <div class="section-head">
        <h2>🔴 ${esc(tr("liveMatches"))}</h2>
        <span>${live.length}</span>
      </div>
      ${matchesHTML(live)}
    </div>
  `;
}

function competitionPreview(){
  if(!state.leagues.length){
    return `<div class="empty">${esc(tr("loading"))}</div>`;
  }

  const list = state.leagues
    .filter(l=>{
      const q=state.search.toLowerCase();
      return !q ||
        l.name.toLowerCase().includes(q) ||
        l.country.toLowerCase().includes(q);
    })
    .slice(0,30);

  if(!list.length){
    return `<div class="empty">${esc(tr("noMatches"))}</div>`;
  }

  return `
    <div class="cards">
      ${list.map(l=>`
        <div class="card click league-card" onclick="openCompetition('${jsSafe(l.id)}')">
          <div class="league-logo">
            ${l.logo ? `<img src="${esc(l.logo)}" onerror="this.style.display='none'">` : "🏆"}
          </div>

          <div>
            <div class="league-name">${esc(l.name)}</div>
            <div class="league-country">${esc(l.country)}</div>
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function competitionsPage(){
  const grouped = {};

  state.leagues
    .filter(l=>{
      const q=state.search.toLowerCase();
      return !q ||
        l.name.toLowerCase().includes(q) ||
        l.country.toLowerCase().includes(q);
    })
    .forEach(l=>{
      if(!grouped[l.country]) grouped[l.country]=[];
      grouped[l.country].push(l);
    });

  const countries = Object.keys(grouped).sort();

  if(!countries.length){
    return `
      <div class="empty">
        ${esc(tr("noMatches"))}
      </div>
    `;
  }

  return `
    <section class="section">
      <div class="section-head">
        <h2>🏆 ${esc(tr("allCompetitions"))}</h2>
        <span>${state.leagues.length}</span>
      </div>

      ${countries.map(country=>`
        <div class="country-title">${esc(country)}</div>

        <div class="cards">
          ${grouped[country].map(l=>`
            <div class="card click league-card" onclick="openCompetition('${jsSafe(l.id)}')">
              <div class="league-logo">
                ${l.logo ? `<img src="${esc(l.logo)}" onerror="this.style.display='none'">` : "🏆"}
              </div>

              <div>
                <div class="league-name">${esc(l.name)}</div>
                <div class="league-country">${esc(country)}</div>
              </div>
            </div>
          `).join("")}
        </div>
      `).join("")}
    </section>
  `;
}

function teamsPage(){
  const map = {};

  state.matches.forEach(m=>{
    [m.home,m.away].forEach(t=>{
      if(t.id && !map[t.id]){
        map[t.id]=t;
      }
    });
  });

  let teams = Object.values(map);

  if(state.search){
    const q=state.search.toLowerCase();
    teams=teams.filter(t=>t.name.toLowerCase().includes(q));
  }

  teams.sort((a,b)=>a.name.localeCompare(b.name));

  if(!teams.length){
    return `<div class="empty">${esc(tr("noMatches"))}</div>`;
  }

  return `
    <section class="section">
      <div class="section-head">
        <h2>👕 ${esc(tr("teams"))}</h2>
        <span>${teams.length}</span>
      </div>

      <div class="cards">
        ${teams.map(t=>`
          <div class="card league-card">
            <div class="league-logo">
              ${t.logo ? `<img src="${esc(t.logo)}" onerror="this.style.display='none'">` : "⚽"}
            </div>
            <div class="league-name">${esc(t.name)}</div>
          </div>
        `).join("")}
      </div>
    </section>
  `;
}

function competitionPage(){
  const l=state.selectedLeague;

  if(!l){
    state.page="competitions";
    return competitionsPage();
  }

  const matches=state.matches.filter(m=>m.leagueId===l.id);

  return `
    <button class="back" onclick="showPage('competitions')">← ${esc(tr("back"))}</button>

    <div class="competition-header">
      <div class="league-logo">
        ${l.logo ? `<img src="${esc(l.logo)}">` : "🏆"}
      </div>

      <div>
        <h1>${esc(l.name)}</h1>
        <p>${esc(l.country)} · ${matches.length} ${esc(tr("fixtures"))}</p>
      </div>
    </div>

    ${matchesHTML(matches,tr("noCompetition"))}
  `;
}

function searchPage(){
  const q=state.search.toLowerCase();

  const leagues=state.leagues.filter(l=>
    l.name.toLowerCase().includes(q) ||
    l.country.toLowerCase().includes(q)
  ).slice(0,20);

  const matches=state.matches.filter(m=>
    m.home.name.toLowerCase().includes(q) ||
    m.away.name.toLowerCase().includes(q) ||
    m.league.toLowerCase().includes(q) ||
    m.country.toLowerCase().includes(q)
  );

  return `
    <section class="section">
      <div class="section-head">
        <h2>🔎 Search</h2>
      </div>

      <div class="country-title">${esc(tr("competitions"))}</div>

      ${
        leagues.length
        ? `<div class="cards">
            ${leagues.map(l=>`
              <div class="card click league-card" onclick="openCompetition('${jsSafe(l.id)}')">
                <div class="league-logo">
                  ${l.logo ? `<img src="${esc(l.logo)}">` : "🏆"}
                </div>
                <div>
                  <div class="league-name">${esc(l.name)}</div>
                  <div class="league-country">${esc(l.country)}</div>
                </div>
              </div>
            `).join("")}
          </div>`
        : `<div class="empty">${esc(tr("noMatches"))}</div>`
      }

      <div class="country-title">${esc(tr("allMatches"))}</div>
      ${matchesHTML(matches)}
    </section>
  `;
}

function render(){
  const app=document.getElementById("app");

  document.documentElement.dir =
    state.language==="ar" ? "rtl" : "ltr";

  document.documentElement.lang=state.language;

  const input=document.getElementById("searchInput");
  input.placeholder=tr("search");
  input.value=state.search;

  document.getElementById("language").value=state.language;

  document.querySelectorAll(".nav button").forEach(btn=>{
    btn.classList.toggle(
      "active",
      btn.dataset.page===state.page
    );
  });

  if(state.loading){
    app.innerHTML=`
      <div class="loading">
        <div class="spinner"></div>
        ${esc(tr("loading"))}
      </div>
    `;
    return;
  }

  if(state.error && !state.matches.length){
    app.innerHTML=`
      <div class="empty">
        ⚠️ ${esc(state.error)}
        <br><br>
        Make sure data.json and leagues.json exist.
      </div>
    `;
    return;
  }

  if(state.search.trim()){
    app.innerHTML=searchPage();
    return;
  }

  if(state.page==="home"){
    app.innerHTML=homePage();
  }
  else if(state.page==="live"){
    app.innerHTML=livePage();
  }
  else if(state.page==="competitions"){
    app.innerHTML=competitionsPage();
  }
  else if(state.page==="teams"){
    app.innerHTML=teamsPage();
  }
  else if(state.page==="competition"){
    app.innerHTML=competitionPage();
  }
}

function showPage(page){
  state.page=page;
  state.selectedLeague=null;
  state.search="";
  document.getElementById("searchInput").value="";
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function goHome(){
  showPage("home");
}

function openCompetition(id){
  const l=state.leagues.find(x=>x.id===id);

  if(!l) return;

  state.selectedLeague=l;
  state.page="competition";
  state.search="";
  document.getElementById("searchInput").value="";
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function changeDay(day){
  /*
    The current data file is today's feed.
    The GitHub Action can later publish
    separate dated files for full date navigation.
  */
  state.day=day;

  if(day!=="today"){
    alert(
      state.language==="ar"
      ? "بيانات اليوم هي المتوفرة حالياً. غادي نربطو الأيام السابقة والقادمة بالـAPI فالمرحلة التالية."
      : "Today's feed is currently available. Previous and next dates will be connected to the API in the next stage."
    );

    state.day="today";
  }

  render();
}

function searchSite(value){
  state.search=value.trim();
  render();
}

function changeLanguage(lang){
  state.language=lang;
  localStorage.setItem("ghl_lang",lang);
  render();
}

function jsSafe(value){
  return String(value)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");
}

document.getElementById("year").textContent=new Date().getFullYear();

loadData();

setInterval(loadData,5*60*1000);
</script>

</body>
</html>
