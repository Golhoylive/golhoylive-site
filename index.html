<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GolHoyLive - مباريات كرة القدم</title>

<meta name="description" content="GolHoyLive - مباريات كرة القدم أمس واليوم وغداً، أندية ومنتخبات وجميع البطولات.">

<meta name="robots" content="index,follow">

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#06110c;
    color:#ffffff;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input,
select{
    font-family:inherit;
}

/* HEADER */

.header{
    background:#07150f;
    border-bottom:1px solid #18392a;
    position:sticky;
    top:0;
    z-index:100;
}

.header-inner{
    max-width:1100px;
    margin:auto;
    padding:12px;
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    display:flex;
    align-items:center;
    gap:7px;
    color:#32df76;
    font-size:23px;
    font-weight:900;
    white-space:nowrap;
}

.logo-ball{
    width:43px;
    height:43px;
    border-radius:50%;
    background:#32df76;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
}

.search{
    flex:1;
    position:relative;
}

.search input{
    width:100%;
    height:43px;
    background:#0b2116;
    color:white;
    border:1px solid #27523b;
    border-radius:12px;
    outline:none;
    padding:0 15px;
    font-size:14px;
}

.search input:focus{
    border-color:#32df76;
}

.language{
    height:43px;
    background:#0b2116;
    color:white;
    border:1px solid #27523b;
    border-radius:12px;
    padding:0 10px;
}

/* NAV */

.nav{
    background:#081810;
    border-bottom:1px solid #18392a;
}

.nav-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
}

.nav button{
    flex:1;
    border:0;
    background:transparent;
    color:#91a89b;
    padding:14px 8px;
    font-size:14px;
    font-weight:bold;
}

.nav button.active{
    color:#32df76;
    border-bottom:3px solid #32df76;
}

/* MAIN */

.container{
    max-width:1100px;
    margin:auto;
    padding:15px 10px 50px;
}

.hero{
    background:linear-gradient(135deg,#0b2417,#0a1912);
    border:1px solid #1c4932;
    border-radius:15px;
    padding:18px;
    margin-bottom:14px;
}

.hero h1{
    margin:0 0 8px;
    font-size:23px;
}

.hero p{
    margin:0;
    color:#94aaa0;
    line-height:1.7;
}

/* DAYS */

.days{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:13px;
}

.day-button{
    border:1px solid #244d37;
    background:#0a1b13;
    color:#a0b5aa;
    border-radius:12px;
    padding:12px 6px;
    font-size:14px;
    font-weight:bold;
}

.day-button small{
    display:block;
    margin-top:5px;
    font-size:11px;
    opacity:.8;
}

.day-button.active{
    background:#32df76;
    color:#06110c;
    border-color:#32df76;
}

/* COMPETITION FILTERS */

.filters{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding-bottom:5px;
    margin-bottom:13px;
}

.filter{
    flex:0 0 auto;
    border:1px solid #244d37;
    background:#0a1b13;
    color:#9db2a7;
    border-radius:20px;
    padding:8px 14px;
    font-size:12px;
}

.filter.active{
    color:#06110c;
    background:#32df76;
    border-color:#32df76;
}

/* COMPETITION */

.competition{
    background:#091a12;
    border:1px solid #1a3c2b;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:13px;
}

.competition-header{
    background:#0d2418;
    border-bottom:1px solid #1a3c2b;
    padding:11px 13px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.competition-name{
    font-weight:bold;
    font-size:14px;
}

.competition-country{
    color:#718a7c;
    font-size:11px;
}

/* MATCH */

.match{
    display:grid;
    grid-template-columns:65px 1fr 48px;
    align-items:center;
    min-height:82px;
    padding:9px 11px;
    border-bottom:1px solid #142d20;
}

.match:last-child{
    border-bottom:0;
}

.match-time{
    text-align:center;
    color:#a1b5aa;
    font-size:12px;
}

.live-label{
    display:block;
    margin-top:4px;
    color:#ff6464;
    font-size:9px;
    font-weight:bold;
}

.teams{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.team{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
}

.team-logo{
    width:27px;
    height:27px;
    object-fit:contain;
    flex:0 0 27px;
}

.team-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:13px;
}

.scores{
    text-align:center;
    font-weight:900;
    font-size:14px;
}

.score{
    height:28px;
}

.status{
    font-size:9px;
    color:#718a7d;
}

/* EMPTY */

.loading{
    text-align:center;
    padding:50px 15px;
    color:#91a79b;
}

.empty{
    background:#091a12;
    border:1px solid #1a3c2b;
    border-radius:14px;
    text-align:center;
    padding:50px 15px;
    color:#91a79b;
}

.error{
    color:#ff7777;
}

/* LEAGUES */

.leagues{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:10px;
}

.league-card{
    background:#091a12;
    border:1px solid #1a3c2b;
    border-radius:13px;
    padding:14px;
}

.league-card strong{
    display:block;
    margin-bottom:7px;
}

.league-card span{
    color:#718a7d;
    font-size:12px;
}

/* SEARCH RESULTS */

.search-results{
    display:none;
    position:absolute;
    top:48px;
    right:0;
    left:0;
    background:#0b1d14;
    border:1px solid #244d37;
    border-radius:12px;
    overflow:hidden;
    z-index:200;
}

.search-result{
    padding:11px;
    border-bottom:1px solid #183528;
    font-size:13px;
}

.search-result:last-child{
    border-bottom:0;
}

.search-result small{
    display:block;
    color:#718a7d;
    margin-top:4px;
}

/* FOOTER */

.footer{
    border-top:1px solid #18392a;
    text-align:center;
    color:#60786c;
    padding:25px 10px;
    font-size:12px;
}

/* MOBILE */

@media(max-width:650px){

    .header-inner{
        gap:7px;
    }

    .logo{
        font-size:18px;
    }

    .logo-ball{
        width:38px;
        height:38px;
        font-size:22px;
    }

    .language{
        max-width:95px;
        font-size:11px;
    }

    .search input{
        font-size:12px;
    }

    .nav button{
        font-size:12px;
    }

    .match{
        grid-template-columns:55px 1fr 38px;
    }

    .team-logo{
        width:24px;
        height:24px;
        flex-basis:24px;
    }

    .team-name{
        font-size:12px;
    }

}

</style>

</head>

<body>

<!-- HEADER -->

<header class="header">

    <div class="header-inner">

        <div class="logo">

            <div class="logo-ball">⚽</div>

            <span>GolHoyLive</span>

<main class="container">

</main>


<footer class="footer">

    <br>

<script>

/* ==============================
   DATA
============================== */

const state = {

    currentDay: "today",

    today: null,

    yesterday: null,

    tomorrow: null,

    leagues: null,

    selectedLeague: "all"

};


/* ==============================
   HELPERS
============================== */

function el(id){

    return document.getElementById(id);

}


function escapeHTML(value){

    if(value === null || value === undefined){

        return "";

    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function getMatches(data){

    if(Array.isArray(data)){

        return data;

    }

    if(data && Array.isArray(data.matches)){

        return data.matches;

    }

    if(data && Array.isArray(data.data)){

        return data.data;

    }

    if(data && data.data && Array.isArray(data.data.matches)){

        return data.data.matches;

    }

    return [];

}


function getLeague(match){

    return match.league ||
           match.competition ||
           match.tournament ||
           {};

}


function getTeam(match,type){

    if(type === "home"){

        return match.home ||
               match.home_team ||
               match.homeTeam ||
               {};

    }

    return match.away ||
           match.away_team ||
           match.awayTeam ||
           {};

}


function getTeamName(team){

    return team.name ||
           team.team_name ||
           team.short_name ||
           "—";

}


function getTeamLogo(team){

    return team.logo ||
           team.logo_url ||
           team.image ||
           team.crest ||
           "";

}


function getScore(team){

    if(team.score === null || team.score === undefined){

        return "-";

    }

    return team.score;

}


function getLeagueName(match){

    const league = getLeague(match);

    return league.name ||
           league.league_name ||
           "Football";

}


function getLeagueCountry(match){

    const league = getLeague(match);

    return league.country ||
           league.country_name ||
           "";

}


function getLeagueId(match){

    const league = getLeague(match);

    return String(
        league.id ||
        league.league_id ||
        league.name ||
        "other"
    );

}


function getTime(match){

    return match.time ||
           match.kickoff ||
           match.start_time ||
           match.date_time ||
           "--:--";

}


function getStatus(match){

    const status = match.status;

    if(typeof status === "object" && status){

        return String(
            status.status ||
            status.state ||
            status.name ||
            ""
        );

    }

    return String(status || "");

}


function isLive(match){

    const status = getStatus(match).toLowerCase();

    if(
        match.is_live === true ||
        match.live === true ||
        match.in_play === true
    ){

        return true;

    }

    return [
        "live",
        "1h",
        "2h",
        "ht",
        "et",
        "inplay",
        "in_play",
        "first half",
        "second half"
    ].includes(status);

}


/* ==============================
   DATE
============================== */

function getDate(offset){

    const d = new Date();

    d.setHours(12,0,0,0);

    d.setDate(d.getDate() + offset);

    const year = d.getFullYear();

    const month = String(
        d.getMonth()+1
    ).padStart(2,"0");

    const day = String(
        d.getDate()
    ).padStart(2,"0");

    return year+"-"+month+"-"+day;

}


function formatDate(date){

    if(!date){

        return "--";

    }

    const p = date.split("-");

    if(p.length !== 3){

        return date;

    }

    return p[2]+"/"+p[1];

}


/* ==============================
   GROUP MATCHES
============================== */

function groupMatches(matches){

    const groups = {};

    matches.forEach(match => {

        const id = getLeagueId(match);

        if(!groups[id]){

            groups[id] = {

                id:id,

                name:getLeagueName(match),

                country:getLeagueCountry(match),

                matches:[]

            };

        }

        groups[id].matches.push(match);

    });

    return Object.values(groups);

}

   MATCH
