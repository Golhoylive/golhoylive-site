<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GolHoyLive - Live Football Scores</title>

<meta name="description" content="GolHoyLive - Live football scores, results, competitions and national teams from around the world.">
<meta name="keywords" content="football, soccer, live scores, results, La Liga, Premier League, Champions League, Serie A, Bundesliga, Ligue 1">
<meta name="robots" content="index, follow">

<style>

:root{
  --bg:#07100d;
  --bg2:#0b1713;
  --card:#101f19;
  --card2:#13251e;
  --green:#20e070;
  --green2:#13b85a;
  --text:#f4fff8;
  --muted:#8fa79b;
  --border:#20372d;
  --red:#ff5252;
  --yellow:#ffd54f;
  --blue:#4da6ff;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top right,rgba(32,224,112,.10),transparent 30%),
    linear-gradient(180deg,#06100c 0%,#08120f 100%);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

button,
select,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}


/* =========================================================
   HEADER
   ========================================================= */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(5,13,10,.95);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}

.header-inner{
  max-width:1250px;
  margin:auto;
  min-height:72px;
  display:flex;
  align-items:center;
  gap:18px;
  padding:12px 18px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:24px;
  font-weight:900;
  white-space:nowrap;
}

.logo-ball{
  width:40px;
  height:40px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--green),#0a8d46);
  color:#031008;
  font-size:20px;
  box-shadow:0 0 25px rgba(32,224,112,.28);
}

.logo span{
  color:var(--green);
}

.search-box{
  flex:1;
  max-width:500px;
  position:relative;
}

.search-box input{
  width:100%;
  height:44px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#0b1813;
  color:white;
  outline:none;
  padding:0 16px 0 42px;
}

.search-box input:focus{
  border-color:var(--green);
}

.search-icon{
  position:absolute;
  left:14px;
  top:12px;
  color:var(--muted);
}

.language{
  height:44px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#0b1813;
  color:white;
  padding:0 10px;
  outline:none;
}


/* =========================================================
   NAV
   ========================================================= */

.nav{
  border-bottom:1px solid var(--border);
  background:#08130f;
}

.nav-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  gap:4px;
  overflow-x:auto;
  padding:8px 18px;
}

.nav-btn{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:12px 16px;
  border-radius:10px;
  white-space:nowrap;
}

.nav-btn:hover,
.nav-btn.active{
  background:#12301f;
  color:var(--green);
}


/* =========================================================
   MAIN
   ========================================================= */

.container{
  max-width:1250px;
  margin:auto;
  padding:22px 18px 60px;
}

.hero{
  border:1px solid var(--border);
  border-radius:18px;
  background:
    radial-gradient(circle at right top,rgba(32,224,112,.13),transparent 40%),
    linear-gradient(135deg,#0c1d15,#0a1712);
  padding:26px;
  margin-bottom:22px;
}

.hero h1{
  margin:0 0 8px;
  font-size:32px;
}

.hero p{
  color:var(--muted);
  margin:0;
  line-height:1.6;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin:25px 0 14px;
}

.section-title h2{
  margin:0;
  font-size:22px;
}

.section-title small{
  color:var(--muted);
}


/* =========================================================
   DAYS
   ========================================================= */

.days{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px;
}

.day-btn{
  border:1px solid var(--border);
  background:#0b1813;
  color:var(--muted);
  border-radius:10px;
  padding:10px 15px;
  white-space:nowrap;
}

.day-btn.active{
  background:var(--green);
  color:#041008;
  border-color:var(--green);
  font-weight:800;
}


/* =========================================================
   MATCHES
   ========================================================= */

.matches{
  display:grid;
  gap:10px;
}

.match-card{
  background:linear-gradient(135deg,#0e1d17,#0b1813);
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px;
  transition:.2s;
}

.match-card:hover{
  border-color:#2b5a43;
  transform:translateY(-1px);
}

.match-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.league-name{
  color:var(--muted);
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.live{
  color:#fff;
  background:#c62828;
  border-radius:6px;
  padding:3px 7px;
  font-size:10px;
  font-weight:900;
}

.status{
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
}

.teams{
  display:grid;
  grid-template-columns:1fr 80px 1fr;
  align-items:center;
  gap:8px;
}

.team{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.team.away{
  justify-content:flex-end;
  text-align:right;
}

.team-logo{
  width:34px;
  height:34px;
  object-fit:contain;
  border-radius:50%;
  background:#162a20;
  padding:4px;
  flex-shrink:0;
}

.team-name{
  font-weight:700;
  font-size:14px;
  overflow:hidden;
  text-overflow:ellipsis;
}

.score{
  text-align:center;
  font-size:20px;
  font-weight:900;
}

.time{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
  text-align:center;
}

.extra{
  color:var(--green);
  font-size:11px;
}


/* =========================================================
   GRID
   ========================================================= */

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

@media(max-width:1000px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:700px){

  .header-inner{
    flex-wrap:wrap;
  }

  .logo{
    font-size:20px;
  }

  .search-box{
    order:3;
    flex-basis:100%;
    max-width:none;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .hero h1{
    font-size:25px;
  }

}

@media(max-width:450px){

  .grid{
    grid-template-columns:1fr;
  }

  .container{
    padding-left:12px;
    padding-right:12px;
  }

  .teams{
    grid-template-columns:1fr 55px 1fr;
  }

  .team-name{
    font-size:12px;
  }

}


/* =========================================================
   COMPETITIONS / TEAMS
   ========================================================= */

.competition-card{
  border:1px solid var(--border);
  background:linear-gradient(135deg,#101f19,#0c1914);
  border-radius:15px;
  padding:16px;
  min-height:125px;
  transition:.2s;
  cursor:pointer;
}

.competition-card:hover{
  border-color:var(--green);
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.competition-logo{
  width:48px;
  height:48px;
  object-fit:contain;
  background:#172b21;
  border-radius:10px;
  padding:6px;
  margin-bottom:10px;
}

.competition-name{
  font-weight:800;
  line-height:1.3;
}

.competition-country{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}


/* =========================================================
   NATIONAL TEAM CARD
   ========================================================= */

.national-card{
  border:1px solid var(--border);
  background:linear-gradient(135deg,#101f19,#0c1914);
  border-radius:15px;
  padding:16px;
  min-height:150px;
  transition:.2s;
  cursor:pointer;
}

.national-card:hover{
  border-color:var(--green);
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.national-flag{
  width:58px;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  background:#172b21;
  border-radius:12px;
  margin-bottom:12px;
}

.national-name{
  font-weight:900;
  font-size:15px;
  line-height:1.3;
}

.national-region{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}


/* =========================================================
   COUNTRIES
   ========================================================= */

.country-block{
  margin-bottom:22px;
}

.country-title{
  color:var(--green);
  font-size:18px;
  font-weight:900;
  margin-bottom:10px;
}


/* =========================================================
   PAGE HEADER
   ========================================================= */

.page-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

.back-btn{
  border:1px solid var(--border);
  background:#0c1a14;
  color:white;
  border-radius:10px;
  padding:10px 14px;
}

.back-btn:hover{
  border-color:var(--green);
  color:var(--green);
}

.page-title{
  margin:0;
  font-size:25px;
}

.page-subtitle{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}


/* =========================================================
   LOADING
   ========================================================= */

.loading{
  padding:50px 15px;
  text-align:center;
  color:var(--muted);
}

.spinner{
  width:35px;
  height:35px;
  border:3px solid #244132;
  border-top-color:var(--green);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 12px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================================================
   EMPTY / ERROR
   ========================================================= */

.empty{
  padding:45px 20px;
  text-align:center;
  border:1px dashed var(--border);
  border-radius:15px;
  color:var(--muted);
}

.error{
  border:1px solid #713535;
  background:#241212;
  color:#ff9b9b;
  padding:15px;
  border-radius:12px;
}


/* =========================================================
   FOOTER
   ========================================================= */

footer{
  border-top:1px solid var(--border);
  margin-top:30px;
  padding:30px 18px;
  color:var(--muted);
  text-align:center;
}

.footer-logo{
  font-weight:900;
  color:white;
  margin-bottom:8px;
}

.footer-logo span{
  color:var(--green);
}


/* =========================================================
   SEARCH
   ========================================================= */

.search-results{
  margin-top:15px;
}

.search-result{
  display:flex;
  align-items:center;
  gap:12px;
  border:1px solid var(--border);
  background:#0c1a14;
  padding:12px;
  border-radius:10px;
  margin-bottom:8px;
  cursor:pointer;
}

.search-result:hover{
  border-color:var(--green);
}

.search-result img{
  width:35px;
  height:35px;
  object-fit:contain;
}


/* =========================================================
   TOAST
   ========================================================= */

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#13251d;
  border:1px solid var(--green);
  color:white;
  padding:12px 18px;
  border-radius:10px;
  z-index:5000;
  box-shadow:0 10px 35px rgba(0,0,0,.4);
  display:none;
}


/* =========================================================
   RTL
   ========================================================= */

html[dir="rtl"] body{
  text-align:right;
}

html[dir="rtl"] .search-icon{
  left:auto;
  right:14px;
}

html[dir="rtl"] .search-box input{
  padding-left:16px;
  padding-right:42px;
}

html[dir="rtl"] .team.away{
  text-align:left;
}

const state = {

  leagues:[],

  selectedLeague:null,

  language:
    localStorage.getItem("ghl_lang")
    || detectLanguage(),

  loading:true,

  error:null

};


/* =========================================================
   LANGUAGE DETECTION
   ========================================================= */

function detectLanguage(){

  const lang =
    navigator.language ||
    navigator.userLanguage ||
    "en";

  const l =
    lang.toLowerCase();

  if(l.startsWith("ar")){
    return "ar";
  }

  if(l.startsWith("es")){
    return "es";
  }

  if(l.startsWith("fr")){
    return "fr";
  }

  if(l.startsWith("pt")){
    return "pt";
  }

  return "en";

}


/* =========================================================
   TRANSLATION
   ========================================================= */

function t(key){

  return (
    translations[state.language] &&
    translations[state.language][key]
  )
  ||
  translations.en[key]
  ||
  key;

}


function setLanguage(lang){

  if(!translations[lang]){
    return;
  }

  state.language =
    lang;

  localStorage.setItem(
    "ghl_lang",
    lang
  );

  applyDirection();

  render();

}


function applyDirection(){

  const rtl =
    state.language === "ar";

  document.documentElement.lang =
    state.language;

  document.documentElement.dir =
    rtl ? "rtl" : "ltr";

}


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHtml(value){

  if(
    value === undefined ||
    value === null
  ){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function formatTime(value){

  if(!value){
    return "--:--";
  }

  const d =
    new Date(value);

  if(
    Number.isNaN(
      d.getTime()
    )
  ){
    return value;
  }

  return d.toLocaleTimeString(
    state.language,
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function showToast(message){

  const el =
    document.getElementById("toast");

  el.textContent =
    message;

  el.style.display =
    "block";

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(()=>{
      el.style.display =
        "none";
    },2500);

}


/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadData(){

  state.loading =
    true;

  state.error =
    null;

  render();

  try{

    const responses =
      await Promise.all([

        fetch(
          "data.json?x="+Date.now()
        ),

        fetch(
          "leagues.json?x="+Date.now()
        )

      ]);


    const matchesResponse =
      responses[0];

    const leaguesResponse =
      responses[1];


    if(
      !matchesResponse.ok
    ){
      throw new Error(
        "data.json failed"
      );
    }


    if(
      !leaguesResponse.ok
    ){
      throw new Error(
        "leagues.json failed"
      );
    }


    const matchesPayload =
      await matchesResponse.json();


    const leaguesPayload =
      await leaguesResponse.json();


    let matches =
      matchesPayload?.data?.matches
      ||
      matchesPayload?.matches
      ||
      [];


    let countries =
      leaguesPayload?.data?.data
      ||
      leaguesPayload?.data
      ||
      [];


    let leagues = [];


    if(
      Array.isArray(countries)
    ){

      countries.forEach(
        countryBlock=>{

          if(!countryBlock){
            return;
          }

          const countryName =
            countryBlock.country
            ||
            countryBlock.name
            ||
            "International";


          const list =
            countryBlock.leagues
            ||
            [];


          if(
            Array.isArray(list)
          ){

            list.forEach(
              league=>{

                leagues.push({

                  id:
                    league.id,

                  name:
                    league.name
                    ||
                    league.league_name
                    ||
                    "Unknown",

                  country:
                    countryName,

                  logo:
                    league.logo
                    ||
                    league.image
                    ||
                    ""

                });

              }
            );

          }

        }
      );

    }


    if(
      !leagues.length &&
      Array.isArray(
        leaguesPayload?.data?.leagues
      )
    ){

      leagues =
        leaguesPayload.data.leagues.map(
          league=>({

            id:league.id,

            name:
              league.name
              ||
              league.league_name
              ||
              "Unknown",

            country:
              league.country
              ||
              "International",

            logo:
              league.logo
              ||
              ""

          })
        );

    }


    state.matches =
      matches.map(
        normalizeMatch
      );


    state.leagues =
      leagues;


    state.loading =
      false;


    render();

  }
  catch(error){

    console.error(error);

    state.loading =
      false;

    state.error =
      error.message
      ||
      "Unknown error";

    render();

  }

}


/* =========================================================
   NORMALIZE MATCH
   ========================================================= */

function normalizeMatch(match){

  const home =
    match.home
    ||
    match.teams?.home
    ||
    {};

  const away =
    match.away
    ||
    match.teams?.away
    ||
    {};

  const score =
    match.score
    ||
    {};

  const league =
    match.league
    ||
    {};


  return {

    id:
      match.id
      ||
      match.match_id
      ||
      Math.random(),

    date:
      match.date
      ||
      match.datetime
      ||
      match.kickoff
      ||
      "",

    status:
      match.status
      ||
      match.state
      ||
      "",

    minute:
      match.minute
      ||
      match.elapsed
      ||
      "",

    leagueId:
      match.league_id
      ||
      league.id
      ||
      match.leagueId
      ||
      "",

    leagueName:
      match.league_name
      ||
      league.name
      ||
      "Football",

    leagueLogo:
      match.league_logo
      ||
      league.logo
      ||
      "",

    home:{
      id:
        home.id
        ||
        home.team_id
        ||
        "",

      name:
        home.name
        ||
        home.team_name
        ||
        "Home",

      logo:
        home.logo
        ||
        home.image
        ||
        ""
    },

    away:{
      id:
        away.id
        ||
        away.team_id
        ||
        "",

      name:
        away.name
        ||
        away.team_name
        ||
        "Away",

      logo:
        away.logo
        ||
        away.image
        ||
        ""
    },

    homeScore:
      score.home
      ??
      score.fulltime?.home
      ??
      match.home_score
      ??
      "-",

    awayScore:
      score.away
      ??
      score.fulltime?.away
      ??
      match.away_score
      ??
      "-"

  };

}

/* =========================================================
   LIVE DETECTION
   ========================================================= */

function isLiveMatch(match){

  const status =
    String(
      match.status || ""
    ).toLowerCase();


  return (

    status.includes("live")

    ||

    status.includes("1h")

    ||

    status.includes("2h")

    ||

    status.includes("ht")

    ||

    status.includes("halftime")

    ||

    status.includes("first half")

    ||

    status.includes("second half")

    ||

    status.includes("playing")

    ||

    status.includes("in play")

    ||

    (
      match.minute !== "" &&
      match.minute !== null &&
      match.minute !== undefined
    )

  );

}

  app.innerHTML = `

    <div class="page-header">

      <div>

        <h1 class="page-title">

          👕
          ${escapeHtml(
            t("teams")
          )}

        </h1>

        <div class="page-subtitle">

          🌍
          ${nationalTeams.length}
          ${escapeHtml(
            t("nationalTeams")
          )}

        </div>

      </div>

    </div>


    <!-- NATIONAL TEAMS -->

    <div class="section-title">

      <h2>

        🌍
        ${escapeHtml(
          t("nationalTeams")
        )}

      </h2>


      <small>
        ${nationalTeams.length}
      </small>

    </div>


    <div class="grid">

      ${
        nationalTeams.map(
          team=>`

            <div
              class="national-card"
              onclick="searchNationalTeam('${escapeHtml(
                team.name
              )}')"
            >

              <div class="national-flag">

                ${team.flag}

              </div>


              <div class="national-name">

                ${escapeHtml(
                  team.name
                )}

              </div>


              <div class="national-region">

                🇪🇺
                ${escapeHtml(
                  t("europe")
                )}

              </div>

            </div>

          `
        ).join("")
      }

    </div>


    <!-- CLUB TEAMS -->

    <div class="section-title">

      <h2>

        ⚽
        ${escapeHtml(
          t("currentTeams")
        )}

      </h2>


      <small>
        ${uniqueClubs.length}
      </small>

    </div>


    ${
      uniqueClubs.length
      ? `

        <div class="grid">

          ${
            uniqueClubs.map(
              team=>`

                <div
                  class="competition-card"
                >

                  ${
                    team.logo
                    ? `
                      <img
                        class="competition-logo"
                        src="${escapeHtml(
                          team.logo
                        )}"
                        alt=""
                        loading="lazy"
                      >
                    `
                    : `
                      <div class="competition-logo">
                        👕
                      </div>
                    `
                  }


                  <div class="competition-name">

                    ${escapeHtml(
                      team.name
                    )}

                  </div>

                </div>

              `
            ).join("")
          }

        </div>

      `
      : `

        <div class="empty">

          ${escapeHtml(
            t("noResults")
          )}

        </div>

      `
    }

  `;

}


/* =========================================================
   NATIONAL TEAM SEARCH
   ========================================================= */

function searchNationalTeam(
  name
){

  const input =
    document.getElementById(
      "searchInput"
    );


  if(input){

    input.value =
      name;

    state.search =
      name.toLowerCase();

    renderSearchResults();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function setActiveNav(page){

  document
    .querySelectorAll(
      ".nav-btn"
    )
    .forEach(
      btn=>{

        btn.classList.toggle(
          "active",
          btn.dataset.page
          ===
          page
        );

      }
    );

}


function goHome(){

  state.page =
    "home";

  state.selectedLeague =
    null;

  state.day =
    "today";

  render();

}


function openLive(){

  state.page =
    "live";

  render();

}


function openCompetitions(){

  state.page =
    "competitions";

  state.selectedLeague =
    null;

  render();

}


function openTeams(){

  state.page =
    "teams";

  render();

}


/* =========================================================
   DAYS
   ========================================================= */

function changeDay(day){

  state.day =
    day;


  if(
    day === "today"
  ){

    render();

    return;

  }


  showToast(

    state.language === "ar"

    ? "بيانات أمس وغداً غادي نضيفوها فالمرحلة الجاية."

    : state.language === "es"

    ? "Los datos de ayer y mañana se añadirán en la siguiente etapa."

    : state.language === "fr"

    ? "Les données d'hier et de demain seront ajoutées dans la prochaine étape."

    : state.language === "pt"

    ? "Os dados de ontem e amanhã serão adicionados na próxima etapa."

    : "Yesterday and tomorrow data will be added in the next stage."

  );

}


/* =========================================================
   GLOBAL SEARCH
   ========================================================= */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    function(){

      state.search =
        this.value
          .trim()
          .toLowerCase();

      renderSearchResults();

    }
  );


function renderSearchResults(){

  const value =
    state.search;


  const old =
    document.getElementById(
      "globalSearchResults"
    );


  if(old){
    old.remove();
  }


  if(!value){
    return;
  }


  const nationalResults =
    nationalTeams
      .filter(
        team =>
          team.name
            .toLowerCase()
            .includes(value)
      )
      .slice(0,10);


  const leagueResults =
    state.leagues
      .filter(
        league =>
          String(
            league.name
          )
          .toLowerCase()
          .includes(value)
      )
      .slice(0,10);


  const matchResults =
    state.matches
      .filter(
        match =>

          String(
            match.home.name
          )
          .toLowerCase()
          .includes(value)

          ||

          String(
            match.away.name
          )
          .toLowerCase()
          .includes(value)

          ||

          String(
            match.leagueName
          )
          .toLowerCase()
          .includes(value)
      )
      .slice(0,10);


  const box =
    document.createElement(
      "div"
    );


  box.id =
    "globalSearchResults";


  box.className =
    "search-results";


  box.style.maxWidth =
    "1250px";


  box.style.margin =
    "10px auto";


  box.style.padding =
    "0 18px";


  let html =
    "";


  nationalResults.forEach(
    team=>{

      html += `

        <div
          class="search-result"
          onclick="searchNationalTeam('${escapeHtml(
            team.name
          )}')"
        >

          <div
            style="
              font-size:30px;
              width:35px;
              text-align:center
            "
          >
            ${team.flag}
          </div>


          <div>

            <strong>

              ${escapeHtml(
                team.name
              )}

            </strong>


            <div
              style="
                color:var(--green);
                font-size:12px
              "
            >

              🇪🇺
              ${escapeHtml(
                t("nationalTeams")
              )}

            </div>

          </div>

        </div>

      `;

    }
  );


  leagueResults.forEach(
    league=>{

      html += `

        <div
          class="search-result"
          onclick="openCompetition('${escapeHtml(
            String(league.id)
          )}')"
        >

          ${
            league.logo
            ? `
              <img
                src="${escapeHtml(
                  league.logo
                )}"
                alt=""
              >
            `
            : "🏆"
          }


          <div>

            <strong>

              ${escapeHtml(
                league.name
              )}

            </strong>


            <div
              style="
                color:var(--muted);
                font-size:12px
              "
            >

              ${escapeHtml(
                league.country || ""
              )}

            </div>

          </div>

        </div>

      `;

    }
  );


  matchResults.forEach(
    match=>{

      html += `

        <div class="search-result">

          ${
            match.home.logo
            ? `
              <img
                src="${escapeHtml(
                  match.home.logo
                )}"
                alt=""
              >
            `
            : "⚽"
          }


          <div>

            <strong>

              ${escapeHtml(
                match.home.name
              )}

              -

              ${escapeHtml(
                match.away.name
              )}

            </strong>


            <div
              style="
                color:var(--muted);
                font-size:12px
              "
            >

              ${escapeHtml(
                match.leagueName
              )}

            </div>

          </div>

        </div>

      `;

    }
  );


  if(!html){

    html = `

      <div class="empty">

        ${escapeHtml(
          t("noResults")
        )}

      </div>

    `;

  }


  box.innerHTML =
    html;


  const header =
    document.querySelector(
      ".header"
    );


  header.after(box);

}


/* =========================================================
   COMPETITION SEARCH
   ========================================================= */

function filterCompetitions(
  value
){

  const search =
    String(value || "")
      .trim()
      .toLowerCase();


  document
    .querySelectorAll(
      ".country-block"
    )
    .forEach(
      block=>{

        let visible =
          0;


        block
          .querySelectorAll(
            ".competition-card"
          )
          .forEach(
            card=>{

              const text =
                card.textContent
                  .toLowerCase();


              const show =
                !search
                ||
                text.includes(
                  search
                );


              card.style.display =
                show
                ? ""
                : "none";


              if(show){
                visible++;
              }

            }
          );


        block.style.display =
          visible
          ? ""
          : "none";

      }
    );

}


/* =========================================================
   CLOSE SEARCH
   ========================================================= */

document.addEventListener(
  "click",
  function(event){

    const results =
      document.getElementById(
        "globalSearchResults"
      );


    const input =
      document.getElementById(
        "searchInput"
      );


    if(
      results &&
      !results.contains(
        event.target
      ) &&
      event.target !== input
    ){

      results.remove();

    }

  }
);


/* =========================================================
   LANGUAGE SELECT
   ========================================================= */

document
  .getElementById(
    "languageSelect"
  )
  .value =
    state.language;


document
  .getElementById(
    "languageSelect"
  )
  .addEventListener(
    "change",
    function(){

      setLanguage(
        this.value
      );

    }
  );


/* =========================================================
   AUTO REFRESH
   ========================================================= */

setInterval(
  ()=>{
    loadData();
  },
  5 * 60 * 1000
);


/* =========================================================
   START
   ========================================================= */

applyDirection();

loadData();


</script>

</body>
</html>
