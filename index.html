<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>GolHoyLive - Live Football Scores</title>

<meta name="description" content="GolHoyLive - Live football scores, results, competitions and national teams from around the world.">
<meta name="robots" content="index,follow">

<style>
:root{
  --bg:#07100d;
  --card:#101f19;
  --card2:#0c1914;
  --green:#20e070;
  --text:#f4fff8;
  --muted:#8fa79b;
  --border:#20372d;
  --red:#c62828;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:
    radial-gradient(circle at top right,rgba(32,224,112,.10),transparent 30%),
    linear-gradient(180deg,#06100c 0%,#08120f 100%);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

button,input,select{font:inherit}
button{cursor:pointer}
img{max-width:100%}

.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(5,13,10,.96);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}

.header-inner{
  max-width:1250px;
  min-height:72px;
  margin:auto;
  padding:12px 18px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:24px;
  font-weight:900;
  white-space:nowrap;
  cursor:pointer;
}

.logo-ball{
  width:40px;
  height:40px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--green),#0a8d46);
  color:#031008;
  font-size:20px;
  box-shadow:0 0 25px rgba(32,224,112,.28);
}

.logo span{color:var(--green)}

.search-box{
  flex:1;
  max-width:500px;
  position:relative;
}

.search-box input{
  width:100%;
  height:44px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#0b1813;
  color:white;
  outline:none;
  padding:0 16px 0 42px;
}

.search-box input:focus{border-color:var(--green)}

.search-icon{
  position:absolute;
  left:14px;
  top:10px;
  font-size:20px;
  color:var(--muted);
  z-index:2;
}

.language{
  height:44px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#0b1813;
  color:white;
  padding:0 12px;
  outline:none;
}

.nav{
  border-bottom:1px solid var(--border);
  background:#08130f;
}

.nav-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  gap:4px;
  overflow-x:auto;
  padding:8px 18px;
}

.nav-btn{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:12px 16px;
  border-radius:10px;
  white-space:nowrap;
}

.nav-btn:hover,
.nav-btn.active{
  background:#12301f;
  color:var(--green);
}

.container{
  max-width:1250px;
  margin:auto;
  padding:22px 18px 60px;
}

.hero{
  border:1px solid var(--border);
  border-radius:18px;
  background:
    radial-gradient(circle at right top,rgba(32,224,112,.13),transparent 40%),
    linear-gradient(135deg,#0c1d15,#0a1712);
  padding:26px;
  margin-bottom:22px;
}

.hero h1{
  margin:0 0 8px;
  font-size:32px;
}

.hero p{
  color:var(--muted);
  margin:0;
  line-height:1.6;
}

.days{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px;
}

.day-btn{
  border:1px solid var(--border);
  background:#0b1813;
  color:var(--muted);
  border-radius:10px;
  padding:10px 15px;
  white-space:nowrap;
}

.day-btn.active{
  background:var(--green);
  color:#041008;
  border-color:var(--green);
  font-weight:800;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin:25px 0 14px;
}

.section-title h2{
  margin:0;
  font-size:22px;
}

.section-title small{color:var(--muted)}

.matches{
  display:grid;
  gap:10px;
}

.match-card{
  background:linear-gradient(135deg,#0e1d17,#0b1813);
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px;
  transition:.2s;
}

.match-card:hover{
  border-color:#2b5a43;
  transform:translateY(-1px);
}

.match-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.league-name{
  color:var(--muted);
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.live{
  color:white;
  background:var(--red);
  border-radius:6px;
  padding:3px 7px;
  font-size:10px;
  font-weight:900;
}

.status{
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
}

.teams{
  display:grid;
  grid-template-columns:1fr 80px 1fr;
  align-items:center;
  gap:8px;
}

.team{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.team.away{
  justify-content:flex-end;
  text-align:right;
}

.team-logo{
  width:34px;
  height:34px;
  object-fit:contain;
  border-radius:50%;
  background:#162a20;
  padding:4px;
  flex-shrink:0;
}

.team-name{
  font-weight:700;
  font-size:14px;
  overflow:hidden;
  text-overflow:ellipsis;
}

.score{
  text-align:center;
  font-size:20px;
  font-weight:900;
}

.time{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
  text-align:center;
}

.extra{
  color:var(--green);
  font-size:11px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.competition-card,
.national-card{
  border:1px solid var(--border);
  background:linear-gradient(135deg,#101f19,#0c1914);
  border-radius:15px;
  padding:16px;
  min-height:125px;
  transition:.2s;
}

.competition-card:hover,
.national-card:hover{
  border-color:var(--green);
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.competition-card{cursor:pointer}

.competition-logo{
  width:48px;
  height:48px;
  object-fit:contain;
  background:#172b21;
  border-radius:10px;
  padding:6px;
  margin-bottom:10px;
}

.competition-name{
  font-weight:800;
  line-height:1.3;
}

.competition-country{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.national-card{
  min-height:155px;
  cursor:pointer;
}

.national-flag{
  width:58px;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:39px;
  background:#172b21;
  border-radius:12px;
  margin-bottom:12px;
}

.national-name{
  font-weight:900;
  font-size:15px;
  line-height:1.3;
}

.national-region{
  color:var(--muted);
  font-size:12px;
  margin-top:6px;
}

.region-block{
  margin-bottom:30px;
}

.region-title{
  color:var(--green);
  font-size:20px;
  font-weight:900;
  margin-bottom:12px;
}

.page-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

.back-btn{
  border:1px solid var(--border);
  background:#0c1a14;
  color:white;
  border-radius:10px;
  padding:10px 14px;
}

.page-title{
  margin:0;
  font-size:25px;
}

.page-subtitle{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.loading{
  padding:50px 15px;
  text-align:center;
  color:var(--muted);
}

.spinner{
  width:35px;
  height:35px;
  border:3px solid #244132;
  border-top-color:var(--green);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 12px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.empty{
  padding:45px 20px;
  text-align:center;
  border:1px dashed var(--border);
  border-radius:15px;
  color:var(--muted);
}

.error{
  border:1px solid #713535;
  background:#241212;
  color:#ff9b9b;
  padding:15px;
  border-radius:12px;
}

.search-results{
  position:absolute;
  top:58px;
  left:0;
  right:0;
  z-index:2000;
  background:#0b1813;
  border:1px solid var(--border);
  border-radius:12px;
  padding:8px;
  max-height:430px;
  overflow:auto;
}

.search-result{
  display:flex;
  align-items:center;
  gap:12px;
  border:1px solid transparent;
  background:#0c1a14;
  padding:10px;
  border-radius:10px;
  margin-bottom:6px;
  cursor:pointer;
}

.search-result:hover{
  border-color:var(--green);
}

.search-result img{
  width:35px;
  height:35px;
  object-fit:contain;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#13251d;
  border:1px solid var(--green);
  color:white;
  padding:12px 18px;
  border-radius:10px;
  z-index:5000;
  box-shadow:0 10px 35px rgba(0,0,0,.4);
  display:none;
}

.country-search{
  max-width:none;
  margin-bottom:22px;
}

footer{
  border-top:1px solid var(--border);
  margin-top:30px;
  padding:30px 18px;
  color:var(--muted);
  text-align:center;
}

.footer-logo{
  font-weight:900;
  color:white;
  margin-bottom:8px;
}

.footer-logo span{color:var(--green)}

html[dir="rtl"] body{text-align:right}

html[dir="rtl"] .search-icon{
  left:auto;
  right:14px;
}

html[dir="rtl"] .search-box input{
  padding-left:16px;
  padding-right:42px;
}

html[dir="rtl"] .team.away{text-align:left}

@media(max-width:1000px){
  .grid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:700px){

  .header-inner{flex-wrap:wrap}

  .logo{font-size:20px}

  .search-box{
    order:3;
    flex-basis:100%;
    max-width:none;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .hero h1{font-size:25px}
}

@media(max-width:450px){

  .grid{grid-template-columns:1fr}

  .container{
    padding-left:12px;
    padding-right:12px;
  }

  .teams{
    grid-template-columns:1fr 55px 1fr;
  }

  .team-name{font-size:12px}
}
</style>
</head>

/* =========================================================

   ========================================================= */

const state={
  page:"home",
  matches:[],
  leagues:[],
  selectedLeague:null,
  language:localStorage.getItem("ghl_lang")||detectLanguage(),
  loading:true,
  error:null
};


/* =========================================================
   LANGUAGE
   ========================================================= */

function detectLanguage(){

  const l=(navigator.language||"en").toLowerCase();

  if(l.startsWith("ar"))return"ar";
  if(l.startsWith("es"))return"es";
  if(l.startsWith("fr"))return"fr";
  if(l.startsWith("pt"))return"pt";

  return"en";
}

function t(key){
  return translations[state.language]?.[key]
    ||translations.en[key]
    ||key;
}

function setLanguage(lang){

  if(!translations[lang])return;

  state.language=lang;

  localStorage.setItem(
    "ghl_lang",
    lang
  );

  applyDirection();
  render();
}

function applyDirection(){

  document.documentElement.lang=
    state.language;

  document.documentElement.dir=
    state.language==="ar"
    ?"rtl"
    :"ltr";
}


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHtml(value){

  if(value===undefined||value===null)return"";

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatTime(value){

  if(!value)return"--:--";

  const d=new Date(value);

  if(Number.isNaN(d.getTime()))
    return value;

  return d.toLocaleTimeString(
    state.language,
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}

function showToast(message){

  const el=
    document.getElementById("toast");

  el.textContent=message;
  el.style.display="block";

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(
    ()=>{
      el.style.display="none";
    },
    2500
  );
}


/* =========================================================
   LOAD API DATA
   ========================================================= */

async function loadData(){

  state.loading=true;
  state.error=null;

  render();

  try{

    const [
      matchesResponse,
      leaguesResponse
    ]=await Promise.all([

      fetch(
        "data.json?x="+Date.now()
      ),

      fetch(
        "leagues.json?x="+Date.now()
      )

    ]);

    if(!matchesResponse.ok)
      throw new Error("data.json failed");

    if(!leaguesResponse.ok)
      throw new Error("leagues.json failed");

    const matchesPayload=
      await matchesResponse.json();

    const leaguesPayload=
      await leaguesResponse.json();


    let rawMatches=
      matchesPayload?.data?.matches
      ||
      matchesPayload?.matches
      ||
      [];


    let countryBlocks=
      leaguesPayload?.data?.data
      ||
      leaguesPayload?.data
      ||
      [];


    let leagues=[];


    if(Array.isArray(countryBlocks)){

      countryBlocks.forEach(
        block=>{

          const country=
            block.country
            ||
            block.name
            ||
            "International";

          const list=
            block.leagues
            ||
            [];


          if(!Array.isArray(list))
            return;


          list.forEach(
            league=>{

              leagues.push({

                id:league.id,

                name:
                  league.name
                  ||
                  league.league_name
                  ||
                  "Unknown",

                country,

                logo:
                  league.logo
                  ||
                  league.image
                  ||
                  ""

              });

            }
          );

        }
      );

    }


    if(
      !leagues.length &&
      Array.isArray(
        leaguesPayload?.data?.leagues
      )
    ){

      leagues=
        leaguesPayload.data.leagues.map(
          league=>({

            id:league.id,

            name:
              league.name
              ||
              league.league_name
              ||
              "Unknown",

            country:
              league.country
              ||
              "International",

            logo:
              league.logo
              ||
              ""

          })
        );

    }


    state.matches=
      rawMatches.map(
        normalizeMatch
      );

    state.leagues=
      leagues;

    state.loading=false;

    render();

  }
  catch(error){

    console.error(error);

    state.loading=false;

    state.error=
      error.message
      ||
      "Unknown error";

    render();
  }
}


/* =========================================================
   NORMALIZE MATCH
   ========================================================= */

function normalizeMatch(match){

  const home=
    match.home
    ||
    match.teams?.home
    ||
    {};

  const away=
    match.away
    ||
    match.teams?.away
    ||
    {};

  const score=
    match.score
    ||
    {};

  const league=
    match.league
    ||
    {};


  return{

    id:
      match.id
      ||
      match.match_id
      ||
      Math.random(),

    date:
      match.date
      ||
      match.datetime
      ||
      match.kickoff
      ||
      "",

    status:
      match.status
      ||
      match.state
      ||
      "",

    minute:
      match.minute
      ||
      match.elapsed
      ||
      "",

    leagueId:
      match.league_id
      ||
      match.leagueId
      ||
      league.id
      ||
      "",

    leagueName:
      match.league_name
      ||
      league.name
      ||
      "Football",

    leagueLogo:
      match.league_logo
      ||
      league.logo
      ||
      "",

    home:{
      id:
        home.id
        ||
        home.team_id
        ||
        "",

      name:
        home.name
        ||
        home.team_name
        ||
        "Home",

      logo:
        home.logo
        ||
        home.image
        ||
        ""
    },

    away:{
      id:
        away.id
        ||
        away.team_id
        ||
        "",

      name:
        away.name
        ||
        away.team_name
        ||
        "Away",

      logo:
        away.logo
        ||
        away.image
        ||
        ""
    },

    homeScore:
      score.home
      ??
      score.fulltime?.home
      ??
      match.home_score
      ??
      "-",

    awayScore:
      score.away
      ??
      score.fulltime?.away
      ??
      match.away_score
      ??
      "-"

  };
}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

  const app=
    document.getElementById("app");


  if(state.loading){

    app.innerHTML=`

      <div class="loading">

        <div class="spinner"></div>

        ${escapeHtml(t("loading"))}

      </div>

    `;

    return;
  }


  if(state.error){

    app.innerHTML=`

      <div class="error">

        ⚠️ ${escapeHtml(state.error)}

        <br><br>

        <button
          class="back-btn"
          onclick="loadData()"
        >
          🔄 Retry
        </button>

      </div>

    `;

    return;
  }


  if(state.page==="home")
    return renderHome();

  if(state.page==="live")
    return renderLive();

  if(state.page==="competitions")
    return renderCompetitions();

  if(state.page==="competition")
    return renderCompetitionPage();

  if(state.page==="teams")
    return renderTeams();
}

/* =========================================================
   LIVE
   ========================================================= */

function isLiveMatch(match){

  const s=
    String(match.status||"")
    .toLowerCase();

  return(
    s.includes("live")
    ||
    s.includes("1h")
    ||
    s.includes("2h")
    ||
    s.includes("ht")
    ||
    s.includes("playing")
    ||
    s.includes("in play")
    ||
    (
      match.minute!=="" &&
      match.minute!==null &&
      match.minute!==undefined
    )
  );
}

function renderLive(){

  setActiveNav("live");

  const matches=
    state.matches.filter(
      isLiveMatch
    );


  document.getElementById("app").innerHTML=`

    <div class="page-header">

      <div>

        <h1 class="page-title">
          🔴 ${escapeHtml(t("live"))}
        </h1>

        <div class="page-subtitle">
          ${matches.length}
        </div>

      </div>

    </div>


    ${
      matches.length
      ?
      renderMatches(matches)
      :
      `
        <div class="empty">

          🔴<br><br>

          ${
            state.language==="ar"
            ?"لا توجد مباريات مباشرة الآن"
            :
            state.language==="es"
            ?"No hay partidos en directo ahora"
            :
            state.language==="fr"
            ?"Aucun match en direct"
            :
            state.language==="pt"
            ?"Nenhum jogo ao vivo agora"
            :
            "No live matches right now"
          }

        </div>
      `
    }

  `;
}


/* =========================================================

   ========================================================= */

function renderMatches(matches){

  return`

    <div class="matches">

      ${matches.map(renderMatch).join("")}

    </div>

  `;
}


function renderMatch(match){

  const live=
    isLiveMatch(match);


  const status=
    live
    ?
    (
      match.minute
      ?
      `${match.minute}'`
      :
      t("liveNow")
    )
    :
    (
      match.status
      ||
      formatTime(match.date)
    );


  return`

    <div class="match-card">

      <div class="match-top">

        <div class="league-name">

          ${
            match.leagueLogo
            ?
            `<img
              src="${escapeHtml(match.leagueLogo)}"
              style="width:18px;height:18px;object-fit:contain;vertical-align:middle"
              alt=""
            >`
            :
            "🏆"
          }

          ${escapeHtml(match.leagueName)}

        </div>


        ${
          live
          ?
          `<div class="live">LIVE</div>`
          :
          `<div class="status">${escapeHtml(status)}</div>`
        }

      </div>


      <div class="teams">

        <div class="team">

          ${
            match.home.logo
            ?
            `<img
              class="team-logo"
              src="${escapeHtml(match.home.logo)}"
              alt=""
              loading="lazy"
            >`
            :
            `<div class="team-logo">⚽</div>`
          }

          <div class="team-name">
            ${escapeHtml(match.home.name)}
          </div>

        </div>


        <div>

          <div class="score">

            ${escapeHtml(match.homeScore)}
            -
            ${escapeHtml(match.awayScore)}

          </div>

          <div class="time">

            ${
              live
              ?
              `<span class="extra">${escapeHtml(status)}</span>`
              :
              escapeHtml(formatTime(match.date))
            }

          </div>

        </div>


        <div class="team away">

          <div class="team-name">
            ${escapeHtml(match.away.name)}
          </div>

          ${
            match.away.logo
            ?
            `<img
              class="team-logo"
              src="${escapeHtml(match.away.logo)}"
              alt=""
              loading="lazy"
            >`
            :
            `<div class="team-logo">⚽</div>`
          }

      </div>

}

      <h2>
        ${escapeHtml(t("todayMatches"))}
      </h2>

      <small>${matches.length}</small>

    </div>


    ${
      matches.length
      ?
      renderMatches(matches)
      :
      `
        <div class="empty">
          🏆<br><br>
          ${escapeHtml(t("noMatches"))}
        </div>
      `
    }

  `;
}


/* =========================================================
   NATIONAL TEAMS
   ========================================================= */

function regionLabel(region){

  const map={

    Europe:"europe",
    Africa:"africa",
    Asia:"asia",
    "South America":"southAmerica",
    "North America":"northAmerica",
    Oceania:"oceania"

  };

  return t(map[region]||"europe");
}


function renderTeams(){

  setActiveNav("teams");


  const grouped={};


  nationalTeams.forEach(
    team=>{

      if(!grouped[team.region])
        grouped[team.region]=[];

      grouped[team.region].push(team);

    }
  );


  const regionOrder=[
    "Europe",
    "Africa",
    "Asia",
    "South America",
    "North America",
    "Oceania"
  ];


  const clubs=[];
  const seen=new Set();


  state.matches.forEach(
    match=>{

      [
        match.home,
        match.away
      ].forEach(
        team=>{

          if(!team?.name)
            return;

          const key=
            String(
              team.id||team.name
            );

          if(seen.has(key))
            return;

          seen.add(key);

          clubs.push(team);

        }
      );

    }
  );


  document.getElementById("app").innerHTML=`

    <div class="page-header">

      <div>

        <h1 class="page-title">
          👕 ${escapeHtml(t("teams"))}
        </h1>

        <div class="page-subtitle">
          🌍 ${nationalTeams.length} ${escapeHtml(t("nationalTeams"))}
        </div>

      </div>

    </div>


    <div class="search-box country-search">

      <div class="search-icon">🔎</div>

      <input
        id="teamSearch"
        type="search"
        placeholder="${escapeHtml(t("search"))}"
        oninput="filterNationalTeams(this.value)"
      >

    </div>


    <div id="nationalTeamsContainer">

      ${
        regionOrder.map(
          region=>{

            const list=
              grouped[region]||[];

            return`

              <section
                class="region-block"
                data-region="${escapeHtml(region)}"
              >

                <div class="region-title">

                  🌍
                  ${escapeHtml(
                    regionLabel(region)
                  )}

                  <span
                    style="
                      color:var(--muted);
                      font-size:12px;
                      margin-left:8px
                    "
                  >
                    ${list.length}
                  </span>

                </div>


                <div class="grid">

                  ${
                    list.map(
                      team=>`

                        <div
                          class="national-card"
                          data-team="${escapeHtml(team.name.toLowerCase())}"
                          onclick="openNationalTeam('${escapeHtml(team.name)}')"
                        >

                          <div class="national-flag">
                            ${team.flag}
                          </div>

                          <div class="national-name">
                            ${escapeHtml(team.name)}
                          </div>

                          <div class="national-region">
                            🌍 ${escapeHtml(regionLabel(region))}
                          </div>

                        </div>

                      `
                    ).join("")
                  }

                </div>

              </section>

            `;

          }
        ).join("")
      }

    </div>


    <div class="section-title">

      <h2>
        ⚽ ${escapeHtml(t("currentTeams"))}
      </h2>

      <small>${clubs.length}</small>

    </div>


    ${
      clubs.length
      ?
      `
        <div class="grid">

          ${
            clubs.map(
              team=>`

                <div class="competition-card">

                  ${
                    team.logo
                    ?
                    `<img
                      class="competition-logo"
                      src="${escapeHtml(team.logo)}"
                      alt=""
                    >`
                    :
                    `<div class="competition-logo">⚽</div>`
                  }

                  <div class="competition-name">
                    ${escapeHtml(team.name)}
                  </div>

                </div>

              `
            ).join("")
          }

        </div>
      `
      :
      `
        <div class="empty">
          ${escapeHtml(t("noResults"))}
        </div>
      `
    }

  `;
}


/* =========================================================
   NATIONAL TEAM SEARCH
   ========================================================= */

function filterNationalTeams(value){

  const search=
    String(value||"")
      .trim()
      .toLowerCase();


  document
    .querySelectorAll(
      ".region-block"
    )
    .forEach(
      block=>{

        let visible=0;


        block
          .querySelectorAll(
            ".national-card"
          )
          .forEach(
            card=>{

              const name=
                card.dataset.team
                ||
                "";


              const show=
                !search
                ||
                name.includes(search);


              card.style.display=
                show
                ?
                ""
                :
                "none";


              if(show)
                visible++;

            }
          );


        block.style.display=
          visible
          ?
          ""
          :
          "none";

      }
    );

}


/* =========================================================
   NATIONAL TEAM CLICK
   ========================================================= */

function openNationalTeam(name){

  const team=
    nationalTeams.find(
      t=>
        t.name.toLowerCase()
        ===
        String(name).toLowerCase()
    );


  if(!team)
    return;


  const matching=
    state.matches.filter(
      match=>

        String(
          match.home.name
        ).toLowerCase()
        .includes(
          team.name.toLowerCase()
        )

        ||

        String(
          match.away.name
        ).toLowerCase()
        .includes(
          team.name.toLowerCase()
        )
    );


  const app=
    document.getElementById("app");


  app.innerHTML=`

    <div class="page-header">

      <button
        class="back-btn"
        onclick="openTeams()"
      >
        ← ${escapeHtml(t("back"))}
      </button>

      <div>

        <h1 class="page-title">

          ${team.flag}

          ${escapeHtml(team.name)}

        </h1>

        <div class="page-subtitle">

          🌍
          ${escapeHtml(
            regionLabel(team.region)
          )}

        </div>

      </div>

    </div>


    <div class="section-title">

      <h2>
        ⚽ ${escapeHtml(t("todayMatches"))}
      </h2>

      <small>${matching.length}</small>

    </div>


    ${
      matching.length
      ?
      renderMatches(matching)
      :
      `
        <div class="empty">

          ${team.flag}

          <br><br>

          ${
            state.language==="ar"
            ?
            "ما كايناش مباراة ديال هاد المنتخب فبيانات اليوم."
            :
            state.language==="es"
            ?
            "No hay partidos de esta selección en los datos de hoy."
            :
            state.language==="fr"
            ?
            "Aucun match de cette sélection dans les données du jour."
            :
            state.language==="pt"
            ?
            "Nenhum jogo desta seleção nos dados de hoje."
            :
            "No match for this national team in today's data."
          }

        </div>
      `
    }

  `;
}


/* =========================================================
   NAVIGATION
   ========================================================= */

function setActiveNav(page){

  document
    .querySelectorAll(".nav-btn")
    .forEach(
      btn=>{

        btn.classList.toggle(
          "active",
          btn.dataset.page===page
        );

      }
    );
}


function goHome(){

  state.page="home";
  state.selectedLeague=null;

  render();
}


function openLive(){

  state.page="live";

  render();
}


function openCompetitions(){

  state.page="competitions";
  state.selectedLeague=null;

  render();
}


function openTeams(){

  state.page="teams";

  render();
}


/* =========================================================
   DAYS
   ========================================================= */

function changeDay(day){

  if(day==="today"){

    render();

    return;
  }


  showToast(

    state.language==="ar"
    ?
    "أمس وغداً غادي نربطوهم بالـAPI فالمرحلة الجاية."

    :
    state.language==="es"
    ?
    "Ayer y mañana se conectarán con la API en la siguiente etapa."

    :
    state.language==="fr"
    ?
    "Hier et demain seront connectés à l'API dans la prochaine étape."

    :
    state.language==="pt"
    ?
    "Ontem e amanhã serão ligados à API na próxima etapa."

    :
    "Yesterday and tomorrow will be connected to the API in the next stage."

  );
}


/* =========================================================
   GLOBAL SEARCH
   ========================================================= */

const searchInput=
  document.getElementById(
    "searchInput"
  );


searchInput.addEventListener(
  "input",
  function(){

    const value=
      this.value
        .trim()
        .toLowerCase();


    document
      .querySelectorAll(
        ".global-search-result"
      )
      .forEach(
        x=>x.remove()
      );


    if(!value)
      return;


    const teams=
      nationalTeams
        .filter(
          team=>
            team.name
              .toLowerCase()
              .includes(value)
        )
        .slice(0,8);


    const leagues=
      state.leagues
        .filter(
          league=>
            String(league.name)
              .toLowerCase()
              .includes(value)
        )
        .slice(0,8);


    if(!teams.length&&!leagues.length)
      return;


    const box=
      document.createElement("div");


    box.className=
      "search-results global-search-result";


    teams.forEach(
      team=>{

        const row=
          document.createElement("div");


        row.className=
          "search-result";


        row.innerHTML=`

          <div style="font-size:28px">
            ${team.flag}
          </div>

          <div>

            <strong>
              ${escapeHtml(team.name)}
            </strong>

            <div
              style="
                color:var(--muted);
                font-size:12px
              "
            >
              🌍 ${escapeHtml(
                regionLabel(team.region)
              )}
            </div>

          </div>

        `;


        row.onclick=()=>{

          box.remove();
          openNationalTeam(
            team.name
          );

        };


        box.appendChild(row);

      }
    );


    leagues.forEach(
      league=>{

        const row=
          document.createElement("div");


        row.className=
          "search-result";


        row.innerHTML=`

          ${
            league.logo
            ?
            `<img
              src="${escapeHtml(league.logo)}"
              alt=""
            >`
            :
            `<div style="font-size:28px">🏆</div>`
          }

          <div>

            <strong>
              ${escapeHtml(league.name)}
            </strong>

            <div
              style="
                color:var(--muted);
                font-size:12px
              "
            >
              ${escapeHtml(
                league.country||""
              )}
            </div>

          </div>

        `;


        row.onclick=()=>{

          box.remove();

          openCompetition(
            league.id
          );

        };


        box.appendChild(row);

      }
    );


    searchInput.parentElement.appendChild(
      box
    );

  }
);


/* =========================================================
   COMPETITION SEARCH
   ========================================================= */

function filterCompetitions(value){

  const search=
    String(value||"")
      .trim()
      .toLowerCase();


  document
    .querySelectorAll(
      ".country-block"
    )
    .forEach(
      block=>{

        let visible=0;


        block
          .querySelectorAll(
            ".competition-card"
          )
          .forEach(
            card=>{

              const text=
                card.textContent
                  .toLowerCase();


              const show=
                !search
                ||
                text.includes(search);


              card.style.display=
                show
                ?
                ""
                :
                "none";


              if(show)
                visible++;

            }
          );


        block.style.display=
          visible
          ?
          ""
          :
          "none";

      }
    );
}

   LANGUAGE
   ========================================================= */

document.getElementById(
  "languageSelect"
).value=
  state.language;


document.getElementById(
  "languageSelect"
).addEventListener(
  "change",
  function(){

    setLanguage(
      this.value
    );

  }
);

   AUTO REFRESH
   ========================================================= */

setInterval(
  ()=>{
    loadData();
  },
  5*60*1000
);


/* =========================================================
   START
   ========================================================= */

applyDirection();

loadData();

</script>
