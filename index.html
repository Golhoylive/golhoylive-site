<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GolHoyLive ⚽</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#00140d;
  color:#ddd;
  font-family:Arial,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#00140d;
  border-bottom:1px solid #174631;
  padding:18px 24px;
}

.top{
  display:flex;
  align-items:center;
  gap:18px;
  max-width:1100px;
  margin:auto;
}

.logo{
  font-size:32px;
  font-weight:bold;
  color:#25df72;
  white-space:nowrap;
}

.ball{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:72px;
  height:72px;
  border-radius:50%;
  background:#28df72;
  font-size:42px;
  margin-right:5px;
}

.search{
  flex:1;
  max-width:430px;
  height:64px;
  border:2px solid #174d35;
  border-radius:22px;
  background:#031b12;
  color:#fff;
  font-size:18px;
  padding:0 20px;
  outline:none;
}

.lang{
  height:64px;
  padding:0 24px;
  border:2px solid #174d35;
  border-radius:22px;
  background:#031b12;
  color:#ddd;
  font-size:17px;
}

nav{
  max-width:1100px;
  margin:0 auto;
  display:flex;
  justify-content:space-around;
  border-bottom:1px solid #174631;
}

nav button{
  flex:1;
  padding:18px 10px;
  background:none;
  color:#aaa;
  border:0;
  font-size:20px;
  cursor:pointer;
}

nav button.active{
  color:#2be477;
  border-bottom:4px solid #2be477;
}

main{
  max-width:1100px;
  margin:auto;
  padding:28px 20px 90px;
}

.hero{
  background:#031b12;
  border:2px solid #174d35;
  border-radius:28px;
  padding:35px 28px;
  margin-bottom:25px;
}

.hero h1{
  margin:0 0 12px;
  color:#fff;
  font-size:40px;
}

.hero p{
  margin:0;
  color:#999;
  font-size:21px;
}

.days{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-bottom:22px;
}

.day{
  background:#031b12;
  border:2px solid #174d35;
  border-radius:28px;
  padding:25px 10px;
  text-align:center;
  cursor:pointer;
}

.day.active{
  background:#2be477;
  color:#00140d;
  border-color:#2be477;
}

.day strong{
  display:block;
  font-size:26px;
  margin-bottom:10px;
}

.day span{
  font-size:20px;
  font-weight:bold;
}

.filters{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:35px;
}

.filter{
  border:2px solid #174d35;
  background:#031b12;
  color:#aaa;
  border-radius:50px;
  padding:14px 25px;
  font-size:19px;
  cursor:pointer;
}

.filter.active{
  background:#2be477;
  color:#00140d;
  border-color:#2be477;
}

.league-card{
  background:#031b12;
  border:2px solid #174d35;
  border-radius:28px;
  margin-bottom:26px;
  overflow:hidden;
}

.league-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 26px;
  border-bottom:1px solid #174631;
}

.league-title{
  font-size:28px;
  font-weight:bold;
  color:#ddd;
}

.country{
  color:#888;
  font-size:19px;
}

.match{
  position:relative;
  min-height:120px;
  padding:20px 30px;
  border-bottom:1px solid #103b29;
  display:grid;
  grid-template-columns:1fr 100px 1fr;
  align-items:center;
  direction:ltr;
}

.match:last-child{
  border-bottom:0;
}

.team{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:22px;
  color:#ddd;
}

.team.home{
  justify-content:flex-end;
  text-align:right;
}

.team.away{
  justify-content:flex-start;
  text-align:left;
}

.team img{
  width:48px;
  height:48px;
  object-fit:contain;
}

.middle{
  text-align:center;
  direction:ltr;
}

.time{
  color:#aaa;
  font-size:21px;
  margin-bottom:7px;
}

.score{
  color:#fff;
  font-size:24px;
  font-weight:bold;
}

.live{
  color:#ff3838;
  font-weight:bold;
}

.no-matches{
  text-align:center;
  padding:55px 20px;
  color:#777;
  font-size:21px;
}

.competitions{
  display:flex;
  flex-direction:column;
  gap:20px;
}

.competition{
  background:#031b12;
  border:2px solid #174d35;
  border-radius:25px;
  padding:28px;
  cursor:pointer;
  transition:.2s;
}

.competition:hover{
  border-color:#2be477;
}

.competition-name{
  color:#fff;
  font-size:25px;
  font-weight:bold;
}

.competition-country{
  color:#777;
  font-size:19px;
  margin-top:8px;
}

footer{
  border-top:1px solid #174631;
  text-align:center;
  padding:45px 20px;
  color:#667b70;
  font-size:20px;
}

.hidden{
  display:none!important;
}

@media(max-width:700px){

  header{
    padding:14px 18px;
  }

  .top{
    gap:10px;
  }

  .logo{
    font-size:27px;
  }

  .ball{
    width:62px;
    height:62px;
    font-size:36px;
  }

  .search{
    min-width:0;
    height:58px;
    font-size:16px;
  }

  .lang{
    height:58px;
    padding:0 17px;
    font-size:15px;
  }

  nav button{
    font-size:18px;
  }

  main{
    padding:20px 20px 70px;
  }

  .hero{
    padding:28px 22px;
  }

  .hero h1{
    font-size:32px;
  }

  .hero p{
    font-size:18px;
  }

  .days{
    gap:14px;
  }

  .day{
    padding:22px 7px;
  }

  .day strong{
    font-size:22px;
  }

  .day span{
    font-size:17px;
  }

  .filter{
    padding:12px 21px;
    font-size:17px;
  }

  .league-head{
    padding:20px;
  }

  .league-title{
    font-size:24px;
  }

  .country{
    font-size:17px;
  }

  .match{
    grid-template-columns:1fr 75px 1fr;
    padding:18px 12px;
  }

  .team{
    font-size:19px;
    gap:7px;
  }

  .team img{
    width:43px;
    height:43px;
  }

  .time{
    font-size:18px;
  }

  .score{
    font-size:21px;
  }
}
</style>
</head>

<body>

<header>

  <div class="top">

    <div class="logo">
      GolHoyLive
      <span class="ball">⚽</span>
    </div>

    <input
      id="search"
      class="search"
      type="text"
      placeholder="🔎 ابحث عن فريق"
    >

    <select id="lang" class="lang">
      <option value="ar">العربية</option>
      <option value="es">Español</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="pt">Português</option>
    </select>

  </div>

  <nav>

    <button id="homeBtn" class="active">
      🏠 الرئيسية
    </button>

    <button id="liveBtn">
      🔴 مباشر
    </button>

    <button id="leaguesBtn">
      🏆 البطولات
    </button>

  </nav>

</header>


<main>

  <section id="homePage">

    <div class="hero">
      <h1>مباريات كرة القدم ⚽</h1>
      <p>مباريات الأمس واليوم وغداً</p>
    </div>


    <div class="days">

      <button class="day" data-day="yesterday">
        <strong>الأمس</strong>
        <span id="yesterdayDate"></span>
      </button>

      <button class="day active" data-day="today">
        <strong>اليوم</strong>
        <span id="todayDate"></span>
      </button>

      <button class="day" data-day="tomorrow">
        <strong>غداً</strong>
        <span id="tomorrowDate"></span>
      </button>

    </div>


    <div id="filters" class="filters"></div>

    <div id="matches"></div>

  </section>


  <section id="livePage" class="hidden">

    <div class="hero">
      <h1>🔴 المباريات المباشرة</h1>
      <p>المباريات التي تلعب الآن</p>
    </div>

    <div id="liveMatches"></div>

  </section>


  <section id="leaguesPage" class="hidden">

    <div class="hero">
      <h1>🏆 البطولات</h1>
      <p>البطولات المحددة فقط.</p>
    </div>

    <div id="competitions" class="competitions"></div>

  </section>

</main>


<footer>
  GolHoyLive © 2026<br>
  Football Matches
</footer>


<script>

const state = {
  day:"today",
  filter:"all",
  page:"home",
  search:""
};


let data = {
  today:[],
  yesterday:[],
  tomorrow:[]
};


/* =========================
   NORMALIZE
========================= */

function normName(value){

  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ")
    .trim();

}


/* =========================
   ALLOWED COMPETITIONS
========================= */

const ALLOWED = {

  laLiga:[
    "la liga",
    "laliga",
    "laliga ea sports",
    "primera division",
    "primera division de espana"
  ],

  laLiga2:[
    "la liga 2",
    "laliga hypermotion",
    "segunda division",
    "segunda division de espana",
    "segunda division"
  ],

  premierLeague:[
    "premier league"
  ],

  serieA:[
    "serie a"
  ],

  ligue1:[
    "ligue 1"
  ],

  bundesliga:[
    "bundesliga"
  ],

  saudi:[
    "saudi pro league",
    "saudi professional league",
    "saudi league"
  ],

  morocco:[
    "botola",
    "botola pro",
    "botola pro 1",
    "morocco league",
    "moroccan league"
  ],

  mls:[
    "mls",
    "major league soccer"
  ],

  mexico:[
    "liga mx",
    "liga bbva mx",
    "mexico league",
    "mexican league"
  ],

  champions:[
    "champions league",
    "uefa champions league"
  ],

  europa:[
    "europa league",
    "uefa europa league"
  ],

  conference:[
    "conference league",
    "uefa conference league"
  ],

  libertadores:[
    "copa libertadores",
    "conmebol libertadores"
  ],

  sudamericana:[
    "copa sudamericana",
    "conmebol sudamericana"
  ],

  afcon:[
    "afcon",
    "africa cup of nations",
    "african cup of nations"
  ],

  euro:[
    "euro",
    "european championship",
    "uefa european championship"
  ],

  worldCup:[
    "world cup",
    "fifa world cup"
  ],

  worldCupQualifiers:[
    "world cup qualifiers",
    "world cup qualification",
    "fifa world cup qualification",
    "fifa world cup qualifiers"
  ],

  asianCup:[
    "asian cup",
    "afc asian cup",
    "asia cup"
  ],

  asianChampions:[
    "afc champions league elite",
    "afc champions league",
    "asian champions league",
    "champions league elite"
  ]

};


/* =========================
   BLOCKED COMPETITIONS
========================= */

const BLOCKED = [

  "women",
  "womens",
  "woman",
  "femenil",
  "femenino",
  "female",
  "feminine",
  "ladies",

  "u17",
  "u18",
  "u19",
  "u20",
  "u21",
  "u22",
  "u23",

  "youth",
  "reserve",
  "reserves",
  "amateur",
  "regional",

  "division 2",
  "division 3",
  "2nd division",
  "3rd division"

];


/* =========================
   COUNTRY CHECK
========================= */

function countryIs(country, list){

  const c = normName(country);

  return list.some(x => c === normName(x));

}


/* =========================
   COMPETITION KEY
========================= */

function competitionKey(match){

  const league = match?.league || {};

  const name = normName(league.name);
  const country = normName(league.country);


  if(
    ALLOWED.laLiga.includes(name) &&
    countryIs(country,["Spain","España"])
  ){
    return "laLiga";
  }


  if(
    ALLOWED.laLiga2.includes(name) &&
    countryIs(country,["Spain","España"])
  ){
    return "laLiga2";
  }


  if(
    ALLOWED.premierLeague.includes(name) &&
    countryIs(country,["England","United Kingdom"])
  ){
    return "premierLeague";
  }


  if(
    ALLOWED.serieA.includes(name) &&
    countryIs(country,["Italy","Italia"])
  ){
    return "serieA";
  }


  if(
    ALLOWED.ligue1.includes(name) &&
    countryIs(country,["France","Francia"])
  ){
    return "ligue1";
  }


  if(
    ALLOWED.bundesliga.includes(name) &&
    countryIs(country,["Germany","Deutschland","Alemania"])
  ){
    return "bundesliga";
  }


  if(
    ALLOWED.saudi.includes(name) &&
    countryIs(country,["Saudi Arabia"])
  ){
    return "saudi";
  }


  if(
    ALLOWED.morocco.includes(name) &&
    countryIs(country,["Morocco","Morocco"])
  ){
    return "morocco";
  }


  if(
    ALLOWED.mls.includes(name) &&
    countryIs(country,["USA","United States","United States of America"])
  ){
    return "mls";
  }


  if(
    ALLOWED.mexico.includes(name) &&
    countryIs(country,["Mexico"])
  ){
    return "mexico";
  }


  if(ALLOWED.champions.includes(name)){
    return "champions";
  }


  if(ALLOWED.europa.includes(name)){
    return "europa";
  }


  if(ALLOWED.conference.includes(name)){
    return "conference";
  }


  if(ALLOWED.libertadores.includes(name)){
    return "libertadores";
  }


  if(ALLOWED.sudamericana.includes(name)){
    return "sudamericana";
  }


  if(ALLOWED.afcon.includes(name)){
    return "afcon";
  }


  if(ALLOWED.euro.includes(name)){
    return "euro";
  }


  if(ALLOWED.worldCup.includes(name)){
    return "worldCup";
  }


  if(ALLOWED.worldCupQualifiers.includes(name)){
    return "worldCupQualifiers";
  }


  if(ALLOWED.asianCup.includes(name)){
    return "asianCup";
  }


  if(ALLOWED.asianChampions.includes(name)){
    return "asianChampions";
  }


  return null;

}


/* =========================
   ALLOWED MATCH
========================= */

function isAllowedCompetition(match){

  const league = match?.league || {};

  const name = normName(league.name);


  if(
    BLOCKED.some(word => name.includes(normName(word)))
  ){
    return false;
  }


  return competitionKey(match) !== null;

}


/* =========================
   HELPERS
========================= */

function matches(day){

  return (data[day] || [])
    .filter(isAllowedCompetition);

}


function league(match){

  return match?.league || {};

}


function home(match){

  return match?.home || {};

}


function away(match){

  return match?.away || {};

}


function teamName(team){

  return team?.name || "-";

}


function teamLogo(team){

  return team?.logo || "";

}


function score(team){

  if(team?.score === null || team?.score === undefined){
    return "-";
  }

  return team.score;

}


function leagueName(match){

  return league(match)?.name || "Unknown";

}


function leagueCountry(match){

  return league(match)?.country || "";

}


function leagueId(match){

  return league(match)?.id || "";

}


function time(match){

  return match?.kickoff ||
         match?.time ||
         match?.date?.split(" ")?.[1]?.slice(0,5) ||
         "--:--";

}


function live(match){

  return match?.status?.is_live === true ||
         match?.status?.state === "inPlay" ||
         String(match?.status?.status || "").toLowerCase() === "live";

}


function matchDate(match){

  return match?.date || "";

}


/* =========================
   DATE HELPERS
========================= */

function getDate(offset){

  const d = new Date();

  d.setDate(d.getDate()+offset);

  return d;

}


function formatDate(d){

  return String(d.getDate()).padStart(2,"0") +
    "/" +
    String(d.getMonth()+1).padStart(2,"0");

}


function setDates(){

  document.getElementById("yesterdayDate").textContent =
    formatDate(getDate(-1));

  document.getElementById("todayDate").textContent =
    formatDate(getDate(0));

  document.getElementById("tomorrowDate").textContent =
    formatDate(getDate(1));

}


/* =========================
   GROUPS
========================= */

function groups(day){

  const arr = matches(day);

  const map = new Map();


  arr.forEach(m => {

    const id = competitionKey(m);

    if(!id) return;


    if(!map.has(id)){

      map.set(id,{
        id:id,
        name:leagueName(m),
        country:leagueCountry(m),
        matches:[]
      });

    }


    map.get(id).matches.push(m);

  });


  return [...map.values()];

}


/* =========================
   MATCH HTML
========================= */

function matchHTML(m){

  const h = home(m);
  const a = away(m);

  const isLive = live(m);


  return `

    <div class="match">

      <div class="team home">

        <span>${teamName(h)}</span>

        ${
          teamLogo(h)
          ?
          `<img src="${teamLogo(h)}" alt="">`
          :
          ""
        }

      </div>


      <div class="middle">

        <div class="time ${isLive ? "live":""}">

          ${
            isLive
            ?
            "🔴 LIVE"
            :
            time(m)
          }

        </div>


        <div class="score">

          ${score(h)} - ${score(a)}

        </div>

      </div>


      <div class="team away">

        ${
          teamLogo(a)
          ?
          `<img src="${teamLogo(a)}" alt="">`
          :
          ""
        }

        <span>${teamName(a)}</span>

      </div>

    </div>

  `;

}


/* =========================
   RENDER
========================= */

function render(){

  if(state.page !== "home") return;


  const container =
    document.getElementById("matches");


  const arr =
    matches(state.day);


  let filtered = arr;


  if(state.filter !== "all"){

    filtered =
      filtered.filter(
        m => competitionKey(m) === state.filter
      );

  }


  if(state.search){

    const q =
      normName(state.search);


    filtered =
      filtered.filter(m => {

        return (

          normName(teamName(home(m))).includes(q) ||

          normName(teamName(away(m))).includes(q) ||

          normName(leagueName(m)).includes(q)

        );

      });

  }


  const map = new Map();


  filtered.forEach(m => {

    const id = competitionKey(m);

    if(!id) return;


    if(!map.has(id)){

      map.set(id,{
        id:id,
        name:leagueName(m),
        country:leagueCountry(m),
        matches:[]
      });

    }


    map.get(id).matches.push(m);

  });


  const arrGroups =
    [...map.values()];


  renderFilters();


  if(!arrGroups.length){

    container.innerHTML =
      `<div class="no-matches">
        لا توجد مباريات في هذا الاختيار.
      </div>`;

    return;

  }


  container.innerHTML =
    arrGroups.map(g => `

      <div class="league-card">

        <div class="league-head">

          <div class="country">
            ${g.country}
          </div>

          <div class="league-title">
            ${g.name}
          </div>

        </div>


        ${g.matches.map(matchHTML).join("")}

      </div>

    `).join("");

}


/* =========================
   FILTER BUTTONS
========================= */

function renderFilters(){

  const container =
    document.getElementById("filters");


  const gs =
    groups(state.day);


  let html = `

    <button
      class="filter ${state.filter==="all" ? "active":""}"
      data-filter="all"
    >
      الكل
    </button>

  `;


  gs.forEach(g => {

    html += `

      <button
        class="filter ${state.filter===g.id ? "active":""}"
        data-filter="${g.id}"
      >
        ${g.name}
      </button>

    `;

  });


  container.innerHTML = html;


  container
    .querySelectorAll(".filter")
    .forEach(btn => {

      btn.onclick = () => {

        state.filter =
          btn.dataset.filter;

        render();

      };

    });

}


/* =========================
   LIVE PAGE
========================= */

function renderLive(){

  const container =
    document.getElementById("liveMatches");


  const all = [

    ...data.yesterday,
    ...data.today,
    ...data.tomorrow

  ];


  const liveMatches =
    all.filter(m =>
      isAllowedCompetition(m) &&
      live(m)
    );


  if(!liveMatches.length){

    container.innerHTML =
      `<div class="no-matches">
        لا توجد مباريات مباشرة الآن.
      </div>`;

    return;

  }


  const map = new Map();


  liveMatches.forEach(m => {

    const id = competitionKey(m);

    if(!id) return;


    if(!map.has(id)){

      map.set(id,{
        id:id,
        name:leagueName(m),
        country:leagueCountry(m),
        matches:[]
      });

    }


    map.get(id).matches.push(m);

  });


  container.innerHTML =
    [...map.values()].map(g => `

      <div class="league-card">

        <div class="league-head">

          <div class="country">
            ${g.country}
          </div>

          <div class="league-title">
            ${g.name}
          </div>

        </div>

        ${g.matches.map(matchHTML).join("")}

      </div>

    `).join("");

}


/* =========================
   COMPETITIONS PAGE
========================= */

function renderLeagues(){

  const container =
    document.getElementById("competitions");


  const all = [

    ...data.yesterday,
    ...data.today,
    ...data.tomorrow

  ];


  const map = new Map();


  all
    .filter(isAllowedCompetition)
    .forEach(m => {

      const id =
        competitionKey(m);

      if(!id) return;


      if(!map.has(id)){

        map.set(id,{
          id:id,
          name:leagueName(m),
          country:leagueCountry(m)
        });

      }

    });


  const competitions =
    [...map.values()];


  if(!competitions.length){

    container.innerHTML =
      `<div class="no-matches">
        لا توجد بطولات حالياً.
      </div>`;

    return;

  }


  container.innerHTML =
    competitions.map(c => `

      <div
        class="competition"
        data-id="${c.id}"
      >

        <div class="competition-name">
          ${c.name} 🏆
        </div>

        <div class="competition-country">
          ${c.country}
        </div>

      </div>

    `).join("");


  container
    .querySelectorAll(".competition")
    .forEach(el => {

      el.onclick = () => {

        openCompetition(
          el.dataset.id
        );

      };

    });

}


/* =========================
   OPEN COMPETITION
========================= */

function openCompetition(id){

  const order = [
    "today",
    "yesterday",
    "tomorrow"
  ];


  let foundDay = null;


  for(const day of order){

    if(
      matches(day).some(
        m => competitionKey(m) === id
      )
    ){

      foundDay = day;
      break;

    }

  }


  if(!foundDay){

    return;

  }


  state.day = foundDay;
  state.filter = id;
  state.page = "home";


  showPage("home");

  updateDayButtons();

  render();

}


/* =========================
   PAGE NAVIGATION
========================= */

function showPage(page){

  state.page = page;


  document
    .getElementById("homePage")
    .classList.toggle(
      "hidden",
      page !== "home"
    );


  document
    .getElementById("livePage")
    .classList.toggle(
      "hidden",
      page !== "live"
    );


  document
    .getElementById("leaguesPage")
    .classList.toggle(
      "hidden",
      page !== "leagues"
    );


  document
    .getElementById("homeBtn")
    .classList.toggle(
      "active",
      page === "home"
    );


  document
    .getElementById("liveBtn")
    .classList.toggle(
      "active",
      page === "live"
    );


  document
    .getElementById("leaguesBtn")
    .classList.toggle(
      "active",
      page === "leagues"
    );


  if(page === "live"){
    renderLive();
  }


  if(page === "leagues"){
    renderLeagues();
  }

}


/* =========================
   DAY BUTTONS
========================= */

function updateDayButtons(){

  document
    .querySelectorAll(".day")
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.day === state.day
      );

    });

}


/* =========================
   EVENTS
========================= */

document
  .querySelectorAll(".day")
  .forEach(btn => {

    btn.onclick = () => {

      state.day =
        btn.dataset.day;

      state.filter = "all";

      updateDayButtons();

      render();

    };

  });


document.getElementById("homeBtn").onclick =
  () => {

    state.filter = "all";

    showPage("home");

    render();

  };


document.getElementById("liveBtn").onclick =
  () => {

    showPage("live");

  };


document.getElementById("leaguesBtn").onclick =
  () => {

    showPage("leagues");

  };


document.getElementById("search").oninput =
  e => {

    state.search =
      e.target.value;

    state.filter = "all";

    if(state.page === "home"){
      render();
    }

  };


/* =========================
   LOAD DATA
========================= */

async function loadFile(path){

  try{

    const res =
      await fetch(
        path + "?v=" + Date.now()
      );


    if(!res.ok){
      return [];
    }


    const json =
      await res.json();


    if(
      json?.data?.matches &&
      Array.isArray(json.data.matches)
    ){

      return json.data.matches;

    }


    if(
      json?.matches &&
      Array.isArray(json.matches)
    ){

      return json.matches;

    }


    if(Array.isArray(json)){
      return json;
    }


    return [];

  }catch(e){

    console.error(
      "Load error:",
      path,
      e
    );

    return [];

  }

}


async function load(){

  setDates();


  const results =
    await Promise.all([

      loadFile("data.json"),

      loadFile("fixtures/yesterday.json"),

      loadFile("fixtures/tomorrow.json")

    ]);


  data.today =
    results[0] || [];


  data.yesterday =
    results[1] || [];


  data.tomorrow =
    results[2] || [];


  render();

}


/* =========================
   START
========================= */

load();

</script>
